<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolphin0x | Master Suite Elite</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root { 
            --bg-deep: #070a13; --bg-glass: rgba(17, 25, 40, 0.85); --border-glass: rgba(255, 255, 255, 0.08);
            --accent-gradient: linear-gradient(135deg, #2563eb, #06b6d4); --text-main: #f8fafc; --text-muted: #94a3b8;
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-deep); color: var(--text-main);
            height: 100vh; overflow: hidden; display: flex;
        }

        /* --- UI & Layout --- */
        #app-container { display: none; width: 100%; height: 100%; grid-template-columns: 280px 1fr; }
        
        .sidebar { background: var(--bg-glass); border-right: 1px solid var(--border-glass); display: flex; flex-direction: column; padding: 20px; gap: 15px; }
        .sidebar-header { font-weight: 700; font-size: 1.4rem; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .section-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-top: 10px; letter-spacing: 1px; }
        .list-container { overflow-y: auto; display: flex; flex-direction: column; gap: 5px; max-height: 40vh; }
        
        .item-btn { padding: 10px 14px; border-radius: 10px; cursor: pointer; color: var(--text-muted); font-weight: 500; font-size: 0.9rem; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .item-btn:hover { background: rgba(255,255,255,0.05); color: white; }
        .item-btn.active { background: var(--accent-gradient); color: white; }

        .chat-area { display: flex; flex-direction: column; flex-grow: 1; position: relative; }
        .chat-header { padding: 20px; border-bottom: 1px solid var(--border-glass); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); backdrop-filter: blur(10px); }
        
        .msg-feed { flex-grow: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 15px; }
        .msg-container { max-width: 75%; display: flex; flex-direction: column; animation: slideIn 0.3s ease; }
        .msg-container.me { align-self: flex-end; align-items: flex-end; }
        .msg-container.other { align-self: flex-start; align-items: flex-start; }
        
        .bubble { padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .me .bubble { background: var(--accent-gradient); color: white; border-bottom-right-radius: 4px; }
        .other .bubble { background: rgba(30, 41, 59, 0.8); border: 1px solid var(--border-glass); border-bottom-left-radius: 4px; }
        .msg-sender { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; padding: 0 4px; }
        .media-chat { max-width: 100%; max-height: 200px; border-radius: 12px; margin-top: 5px; }

        .input-bar { padding: 15px 25px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--border-glass); display: flex; gap: 10px; align-items: center; }
        .input-bar input[type="text"] { flex-grow: 1; padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white; outline: none; }
        
        .btn { padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; color: white; transition: 0.2s; }
        .btn-primary { background: var(--accent-gradient); }
        .btn-secondary { background: rgba(255,255,255,0.1); }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-icon { background: transparent; font-size: 1.2rem; cursor: pointer; border: none; transition: 0.2s; }
        .btn-icon:hover { transform: scale(1.1); }

        /* Auth Overlay */
        .auth-overlay { position: fixed; inset: 0; background: var(--bg-deep); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--bg-glass); padding: 40px; border-radius: 20px; width: 90%; max-width: 340px; text-align: center; border: 1px solid var(--border-glass); }
        .auth-card input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--border-glass); background: rgba(0,0,0,0.5); color: white; box-sizing: border-box; }
        
        /* --- NIEUW: Video Call Overlay --- */
        .call-overlay { position: fixed; inset: 0; background: rgba(7, 10, 19, 0.95); backdrop-filter: blur(15px); z-index: 9998; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .video-grid { display: grid; grid-template-columns: 1fr; gap: 20px; width: 100%; max-width: 800px; aspect-ratio: 16/9; margin-bottom: 30px; }
        @media (min-width: 600px) { .video-grid { grid-template-columns: 1fr 1fr; } }
        .video-box { background: #111827; border-radius: 16px; border: 1px solid var(--border-glass); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 15px; left: 15px; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; }
        .call-controls { display: flex; gap: 15px; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive */
        @media (max-width: 768px) {
            #app-container { display: flex; flex-direction: column; }
            .sidebar { padding: 10px; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--border-glass); max-height: 150px; overflow-y: auto; gap: 5px; }
            .sidebar-header { width: 100%; font-size: 1.1rem; }
            .list-container { flex-direction: row; flex-wrap: nowrap; overflow-x: auto; width: 100%; max-height: auto; padding-bottom: 5px; }
            .section-title { display: none; }
            .item-btn { white-space: nowrap; padding: 8px 12px; }
            .chat-area { flex-grow: 1; height: 0; }
        }
    </style>
</head>
<body>

    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <h1 class="sidebar-header" style="font-size: 2rem; margin-bottom: 5px;">Dolphin0x</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">Master Suite Login</p>
            
            <input type="email" id="email" placeholder="E-mailadres">
            <input type="password" id="pass" placeholder="Wachtwoord">
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn btn-primary" style="flex: 1;" onclick="authEmail(true)">Login</button>
                <button class="btn btn-secondary" style="flex: 1;" onclick="authEmail(false)">Registreer</button>
            </div>
            
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">
            <button class="btn btn-secondary" style="width: 100%; margin-bottom: 10px;" onclick="loginGoogle()">🌐 Login met Google</button>
        </div>
    </div>

    <div id="callOverlay" class="call-overlay">
        <h2 style="margin-top: 0; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Dolphin0x Live Call</h2>
        <div class="video-grid">
            <div class="video-box">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label">Jij (Jouw Preview)</div>
            </div>
            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div id="remotePlaceholder" style="position: absolute; color: var(--text-muted);">Wachten op verbinding...</div>
                <div class="video-label">Gesprekspartner</div>
            </div>
        </div>
        <div class="call-controls">
            <button id="btnToggleMic" class="btn btn-secondary" onclick="toggleMicrophone()">🎙️ Mic Aan</button>
            <button id="btnToggleCam" class="btn btn-secondary" onclick="toggleCamera()">📷 Camera Aan</button>
            <button class="btn btn-danger" onclick="endCall()">🛑 Ophangen</button>
        </div>
    </div>

    <div id="app-container">
        <div class="sidebar">
            <div class="sidebar-header" style="display: flex; justify-content: space-between;">
                Dolphin0x <button class="btn-icon" onclick="logout()" title="Uitloggen" style="font-size:1rem;">🚪</button>
            </div>
            
            <div class="section-title">Publieke Groepen</div>
            <div id="roomList" class="list-container">
                <div class="item-btn active" onclick="setChatContext('room', 'global', this)"># global</div>
                <div class="item-btn" onclick="setChatContext('room', 'dev-talk', this)"># dev-talk</div>
            </div>

            <div class="section-title">Direct Messages</div>
            <div id="userList" class="list-container">
                </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <h3 id="chatTitle" style="margin: 0; font-weight: 600;"># global</h3>
                <button id="btnStartCall" class="btn btn-secondary" onclick="startCall()" style="display: none;">📞 Video Call</button>
            </div>
            
            <div id="msgFeed" class="msg-feed"></div>
            
            <div class="input-bar">
                <input type="file" id="mediaUpload" accept="image/*,video/*" style="display:none;" onchange="handleFileUpload(this)">
                <label for="mediaUpload" class="btn-icon">📎</label>
                <input type="text" id="msgInput" placeholder="Typ je bericht...">
                <button class="btn btn-primary" onclick="sendMessage()">Stuur</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZ0H4mGe6VLzLSb2ow877Xz6j684CwBGU",
            authDomain: "dolphin0x.firebaseapp.com",
            projectId: "dolphin0x",
            storageBucket: "dolphin0x.firebasestorage.app",
            messagingSenderId: "397971950369",
            appId: "1:397971950369:web:06c65ad929479656a10c60"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let chatType = 'room';
        let currentTarget = 'global';
        let unsubscribeMessages = null;
        
        // Call Variabelen
        let localStream = null;
        let isMicEnabled = true;
        let isCamEnabled = true;

        // --- AUTHENTICATIE ---
        window.authEmail = async (isLogin) => {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            if(!e || !p) return alert("Vul alles in.");
            try { isLogin ? await signInWithEmailAndPassword(auth, e, p) : await createUserWithEmailAndPassword(auth, e, p); } 
            catch(err) { alert(err.message); }
        };

        window.loginGoogle = async () => {
            try { await signInWithPopup(auth, new GoogleAuthProvider()); } 
            catch(err) { alert(err.message); }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('app-container').style.display = window.innerWidth <= 768 ? 'flex' : 'grid';
                
                const userName = user.displayName || user.email.split('@')[0];
                await setDoc(doc(db, "users", user.uid), { name: userName, email: user.email });
                
                loadUsers();
                syncMessages();
            } else {
                document.getElementById('authOverlay').style.display = 'flex';
                document.getElementById('app-container').style.display = 'none';
            }
        });

        // --- GEBRUIKERS & CONTEXT ---
        function loadUsers() {
            onSnapshot(collection(db, "users"), (snap) => {
                const list = document.getElementById('userList');
                list.innerHTML = '';
                snap.forEach(doc => {
                    const data = doc.data();
                    if(doc.id !== auth.currentUser.uid) {
                        list.innerHTML += `<div class="item-btn" onclick="setChatContext('private', '${doc.id}', this, '${data.name}')">👤 ${data.name}</div>`;
                    }
                });
            });
        }

        window.setChatContext = (type, targetId, element, displayname = null) => {
            document.querySelectorAll('.item-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            
            chatType = type;
            const callBtn = document.getElementById('btnStartCall');

            if(type === 'room') {
                currentTarget = targetId;
                document.getElementById('chatTitle').innerText = "# " + targetId;
                callBtn.style.display = 'none'; // Verberg bellen in publieke kanalen
            } else {
                currentTarget = [auth.currentUser.uid, targetId].sort().join('_');
                document.getElementById('chatTitle').innerText = "🔒 " + displayname;
                callBtn.style.display = 'block'; // Toon bellen in DM
            }
            syncMessages();
        };

        // --- BEREIKBAARHEID & MEDIA (BELLEN) ---
        window.startCall = async () => {
            document.getElementById('callOverlay').style.display = 'flex';
            
            try {
                // Vraag camera en microfoon op via de browser API
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                document.getElementById('localVideo').srcObject = localStream;
                
                isMicEnabled = true;
                isCamEnabled = true;
                updateMediaLabels();
            } catch (err) {
                alert("Kon geen toegang krijgen tot media-apparaten: " + err.message);
                endCall();
            }
        };

        window.toggleMicrophone = () => {
            if (!localStream) return;
            isMicEnabled = !isMicEnabled;
            // Schakel audio track aan of uit
            localStream.getAudioTracks().forEach(track => track.enabled = isMicEnabled);
            updateMediaLabels();
        };

        window.toggleCamera = () => {
            if (!localStream) return;
            isCamEnabled = !isCamEnabled;
            // Schakel video track aan of uit
            localStream.getVideoTracks().forEach(track => track.enabled = isCamEnabled);
            updateMediaLabels();
        };

        function updateMediaLabels() {
            document.getElementById('btnToggleMic').innerText = isMicEnabled ? "🎙️ Mic Aan" : "🚫 Mic Gedempt";
            document.getElementById('btnToggleCam').innerText = isCamEnabled ? "📷 Camera Aan" : "❌ Camera Uit";
            
            // Visuele feedback voor je eigen camera preview
            document.getElementById('localVideo').style.opacity = isCamEnabled ? "1" : "0.2";
        }

        window.endCall = () => {
            if (localStream) {
                // Stop alle lopende hardware streams (lampje camera gaat uit)
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('callOverlay').style.display = 'none';
        };

        // --- BERICHTEN LOGICA ---
        window.sendMessage = async () => {
            const input = document.getElementById('msgInput');
            if(!input.value.trim()) return;
            await sendPayload(input.value, 'text');
            input.value = '';
        };

        window.handleFileUpload = (input) => {
            const file = input.files[0];
            if(!file) return;
            const type = file.type.startsWith('video') ? 'video' : 'image';
            const reader = new FileReader();
            reader.onload = async (e) => await sendPayload(e.target.result, type);
            reader.readAsDataURL(file);
        };

        async function sendPayload(content, msgType) {
            const collectionPath = chatType === 'room' ? "room_messages" : "private_messages";
            const senderName = auth.currentUser.displayName || auth.currentUser.email.split('@')[0];
            
            try {
                await addDoc(collection(db, collectionPath), {
                    target: currentTarget,
                    sender: senderName,
                    senderId: auth.currentUser.uid,
                    text: content,
                    type: msgType,
                    createdAt: Date.now()
                });
            } catch(e) { console.error("Send Error:", e); }
        }

        function syncMessages() {
            if(unsubscribeMessages) unsubscribeMessages();
            const collectionPath = chatType === 'room' ? "room_messages" : "private_messages";
            
            unsubscribeMessages = onSnapshot(query(collection(db, collectionPath)), (snap) => {
                const feed = document.getElementById('msgFeed');
                let messages = [];
                
                snap.forEach(doc => {
                    if(doc.data().target === currentTarget) messages.push(doc.data());
                });
                
                messages.sort((a,b) => a.createdAt - b.createdAt);
                feed.innerHTML = '';
                
                messages.forEach(data => {
                    const isMe = data.senderId === auth.currentUser.uid;
                    let body = `<div class="bubble">${data.text}</div>`;
                    if(data.type === 'image') body = `<img src="${data.text}" class="media-chat">`;
                    if(data.type === 'video') body = `<video src="${data.text}" controls class="media-chat"></video>`;

                    feed.innerHTML += `
                        <div class="msg-container ${isMe ? 'me' : 'other'}">
                            <div class="msg-sender">${isMe ? 'Jij' : data.sender}</div>
                            ${body}
                        </div>
                    `;
                });
                setTimeout(() => feed.scrollTop = feed.scrollHeight, 50);
            });
        }

        document.getElementById('msgInput').addEventListener('keypress', e => { if(e.key === 'Enter') sendMessage(); });
        window.addEventListener('resize', () => {
            if(auth.currentUser) document.getElementById('app-container').style.display = window.innerWidth <= 768 ? 'flex' : 'grid';
        });
    </script>
</body>
</html>
