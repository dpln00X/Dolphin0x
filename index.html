<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolphin0x // Terminal Portal</title>
    <style>
        :root {
            --bg-dark: #030704;
            --term-green: #33ff33;
            --term-dim: #116611;
            --term-amber: #ffaa00;
            --term-text: #e5ffe5;
            --border-glow: 0 0 10px rgba(51, 255, 51, 0.3);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: var(--term-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        
        body::before {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            z-index: 9999; background-size: 100% 5px; pointer-events: none;
        }

        
        .terminal-container {
            width: 95vw; max-width: 1000px; height: 90vh;
            border: 2px solid var(--term-green); box-shadow: var(--border-glow);
            background: #000000; display: flex; flex-direction: column; position: relative;
        }

        
        .terminal-header {
            padding: 12px 20px; border-bottom: 2px solid var(--term-green);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(51, 255, 51, 0.05); font-weight: bold; font-size: 0.95rem;
        }
        .header-title { display: flex; align-items: center; gap: 12px; }
        .header-dolphin { width: 30px; height: 30px; filter: drop-shadow(0 0 5px var(--term-green)) grayscale(100%); }

        
        .auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; }
        .auth-box {
            border: 2px dashed var(--term-green); padding: 30px; max-width: 380px; width: 100%;
            background: rgba(0, 10, 0, 0.8); text-align: center;
        }
        .auth-box h2 { margin-top: 0; color: #fff; letter-spacing: 2px; font-size: 1.4rem; }

      
        .portal-main { display: none; flex-grow: 1; height: calc(100% - 55px); position: relative; }

     
        .chat-view { width: 100%; height: 100%; display: flex; flex-direction: column; }
        .chat-info-bar { 
            padding: 12px 20px; background: rgba(51, 255, 51, 0.03); 
            border-bottom: 1px solid var(--term-dim); display: flex; justify-content: space-between; align-items: center;
        }
        .messages-log { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

      
        .log-line { line-height: 1.4; font-size: 1rem; color: var(--term-text); word-wrap: break-word; }
        .log-time { color: var(--term-dim); margin-right: 8px; }
        .log-tag { font-weight: bold; margin-right: 8px; text-transform: uppercase; }
        .log-tag.me { color: var(--term-green); }
        .log-tag.them { color: var(--term-amber); }
        .log-tag.global { color: #fff; text-shadow: 0 0 4px var(--term-green); }

       
        .terminal-prompt-bar { 
            padding: 15px 20px; border-top: 2px solid var(--term-green); 
            display: flex; align-items: center; gap: 12px; background: rgba(0,5,0,0.9);
        }
        .prompt-symbol { font-weight: bold; font-size: 1.2rem; color: var(--term-green); animation: blink 1s infinite; }
        
        input[type="text"], input[type="email"], input[type="password"] {
            background: transparent; border: none; color: var(--term-text);
            font-family: 'Courier New', monospace; font-size: 1.05rem; flex-grow: 1; outline: none;
        }
        .auth-box input { border-bottom: 2px solid var(--term-dim); padding: 10px; margin-bottom: 15px; text-align: center; width: 100%; }
        .auth-box input:focus { border-color: var(--term-green); box-shadow: var(--border-glow); }

       
        .network-overlay {
            position: absolute; top: 0; right: -280px; width: 280px; height: 100%;
            background: #000; border-left: 2px solid var(--term-green); z-index: 100;
            transition: right 0.3s ease; display: flex; flex-direction: column;
        }
        .network-overlay.open { right: 0; }
        .network-title { padding: 15px; border-bottom: 2px dashed var(--term-green); font-weight: bold; background: rgba(51, 255, 51, 0.05); }
        .user-nodes-list { flex-grow: 1; overflow-y: auto; }
        .node-item { 
            padding: 12px 20px; cursor: pointer; border-bottom: 1px solid var(--term-dim); 
            font-size: 0.95rem; color: var(--term-text);
        }
        .node-item:hover, .node-item.active { background: var(--term-green); color: #000; font-weight: bold; }

        
        button {
            background: transparent; color: var(--term-green); border: 1px solid var(--term-green);
            padding: 8px 16px; font-family: inherit; cursor: pointer; font-weight: bold; text-transform: uppercase;
        }
        button:hover { background: var(--term-green); color: #000; }
        .auth-box button { width: 100%; margin-top: 10px; padding: 12px; }
        .auth-toggle { margin-top: 15px; font-size: 0.85rem; color: var(--term-dim); cursor: pointer; text-decoration: underline; }
        .auth-toggle:hover { color: var(--term-green); }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="terminal-container">
        <div class="terminal-header">
            <div class="header-title">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHg3Mnd4cHZhcDN3cmFwZHlsMG10OHl0bTBxdXN4YnY2amN1M3N3MiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/u00507MxtYmSk/giphy.gif" alt="Dolphin" class="header-dolphin">
                <span>DOLPHIN0X // CODENAME: PORTAL</span>
            </div>
            <div id="systemStatus">[STATUS: OFFLINE]</div>
        </div>

        <div id="authScreen" class="auth-screen">
            <div class="auth-box">
                <h2 id="authTitle">LOGIN</h2>
                <input type="text" id="authUsername" placeholder="[CHOOSE_CYBERNAME]" style="display:none;">
                <input type="email" id="authEmail" placeholder="[ENTER_EMAIL]">
                <input type="password" id="authPassword" placeholder="[DECRYPTION_KEY]">
                <button onclick="handleAuth()">EXECUTE AUTH()</button>
                <div id="authToggleText" class="auth-toggle" onclick="toggleAuthMode()">No node connection? Register new account.</div>
            </div>
        </div>

        <div id="portalInterface" class="portal-main">
            
            <div class="chat-view">
                <div class="chat-info-bar">
                    <span id="activeChatTarget">> CONNECTED_TO: GLOBAL_HOLO_FEED</span>
                    <div style="display: flex; gap: 10px;">
                        <button onclick="toggleNetworkMenu()">[NET_NODES]</button>
                        <button style="color: var(--term-amber); border-color: var(--term-amber);" onclick="logout()">[EXIT]</button>
                    </div>
                </div>
                
                <div id="messagesBox" class="messages-log"></div>
                
                <div class="terminal-prompt-bar">
                    <span class="prompt-symbol">&gt;</span>
                    <input type="text" id="messageInput" placeholder="ENTER TERMINAL COMMAND OR MESSAGE..." onkeydown="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()">SEND</button>
                </div>
            </div>

            <div id="networkMenu" class="network-overlay">
                <div class="network-title">⚡ ROUTING CONTROLS</div>
                <div class="node-item active" id="globalChannelItem" onclick="selectGlobalChat()" style="color: var(--term-amber); font-weight: bold;">
                    // GLOBAL_HOLO_FEED
                </div>
                <div class="network-title" style="border-top: 1px solid var(--term-green); font-size: 0.85rem;">📡 AVAILABLE ENDPOINTS</div>
                <div id="userList" class="user-nodes-list"></div>
                <button style="margin: 15px; border-style: dashed;" onclick="toggleNetworkMenu()">[CLOSE MENU]</button>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDocs, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZ0H4mGe6VLzLSb2ow877Xz6j684CwBGU",
            authDomain: "dolphin0x.firebaseapp.com",
            databaseURL: "https://dolphin0x-default-rtdb.firebaseio.com",
            projectId: "dolphin0x",
            storageBucket: "dolphin0x.firebasestorage.app",
            messagingSenderId: "397971950369",
            appId: "1:397971950369:web:06c65ad929479656a10c60",
            measurementId: "G-KCEJDSHZFL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let activeChatUserId = "global";
        let unsubscribeChat = null;
        let usersCache = {};

       
        window.handleAuth = async function() {
            const email = document.getElementById("authEmail").value.trim();
            const password = document.getElementById("authPassword").value.trim();
            const username = document.getElementById("authUsername").value.trim();
            const isRegister = document.getElementById("authTitle").innerText === "REGISTER";

            if(!email || !password || (isRegister && !username)) {
                alert("CRITICAL: DATA INVALID."); return;
            }
            if(password.length < 6) {
                alert("CRITICAL: SECURITY KEY MUST BE AT LEAST 6 CHARACTERS."); return;
            }

            try {
                if (isRegister) {
                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", res.user.uid), {
                        uid: res.user.uid,
                        username: username,
                        email: email
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (err) {
                alert("TERMINAL ERROR: " + err.message);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById("authScreen").style.display = "none";
                document.getElementById("portalInterface").style.display = "flex";
                document.getElementById("systemStatus").innerText = "[SYS_ONLINE]";
                await loadUserNodes();
                selectGlobalChat();
            } else {
                currentUser = null;
                document.getElementById("authScreen").style.display = "flex";
                document.getElementById("portalInterface").style.display = "none";
                document.getElementById("systemStatus").innerText = "[SYS_OFFLINE]";
            }
        });

        window.logout = function() { signOut(auth); };

        window.toggleAuthMode = function() {
            const title = document.getElementById("authTitle");
            const userInp = document.getElementById("authUsername");
            const toggleText = document.getElementById("authToggleText");
            if (title.innerText === "LOGIN") {
                title.innerText = "REGISTER"; userInp.style.display = "block";
                toggleText.innerText = "Node active? Switch back to Login prompt.";
            } else {
                title.innerText = "LOGIN"; userInp.style.display = "none";
                toggleText.innerText = "No node connection? Register new account.";
            }
        };

        
        window.toggleNetworkMenu = function() {
            document.getElementById("networkMenu").classList.toggle("open");
        };

        async function loadUserNodes() {
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                const userListEl = document.getElementById("userList");
                userListEl.innerHTML = "";
                usersCache = {};

                querySnapshot.forEach((doc) => {
                    const userData = doc.data();
                    usersCache[userData.uid] = userData.username;

                    if(currentUser && userData.uid === currentUser.uid) return;

                    const item = document.createElement("div");
                    item.className = "node-item";
                    item.id = `node-${userData.uid}`;
                    item.innerText = `// NODE: ${userData.username}`;
                    item.onclick = () => { selectUserChat(userData.uid, userData.username); toggleNetworkMenu(); };
                    userListEl.appendChild(item);
                });
            } catch (err) {
                console.error("Endpoint mapping failed:", err);
            }
        }

        window.selectGlobalChat = function() {
            document.querySelectorAll(".node-item").forEach(el => el.classList.remove("active"));
            document.getElementById("globalChannelItem").classList.add("active");

            activeChatUserId = "global";
            document.getElementById("activeChatTarget").innerText = "> CONNECTED_TO: GLOBAL_HOLO_FEED";
            loadMessages();
        };

        window.selectUserChat = function(targetUid, targetUsername) {
            document.querySelectorAll(".node-item").forEach(el => el.classList.remove("active"));
            const activeEl = document.getElementById(`node-${targetUid}`);
            if(activeEl) activeEl.classList.add("active");

            activeChatUserId = targetUid;
            document.getElementById("activeChatTarget").innerText = `> SECURE_TUNNEL_TO: @${targetUsername}`;
            loadMessages();
        };

        function getChatId(uid1, uid2) {
            return uid1 < uid2 ? `${uid1}_${uid2}` : 
        function loadMessages() {
            if (unsubscribeChat) unsubscribeChat();

            let q;
            if (activeChatUserId === "global") {
                q = query(collection(db, "global_messages"), orderBy("timestamp", "asc"));
            } else {
                const chatId = getChatId(currentUser.uid, activeChatUserId);
                q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            }

            unsubscribeChat = onSnapshot(q, (snapshot) => {
                const box = document.getElementById("messagesBox");
                box.innerHTML = "";

                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isMe = msg.senderId === currentUser.uid;
                    
                    let displayName = usersCache[msg.senderId] || msg.senderName || "UNKNOWN_NODE";
                    let tagClass = "them";
                    if (isMe) { displayName = "YOU"; tagClass = "me"; }
                    if (activeChatUserId === "global" && !isMe) { tagClass = "global"; }

                    const timestamp = msg.timestamp ? new Date(msg.timestamp.toMillis()).toLocaleTimeString('nl-NL', {hour: '2-digit', minute:'2-digit'}) : '--:--';

                    const line = document.createElement("div");
                    line.className = "log-line";
                    line.innerHTML = `
                        <span class="log-time">[${timestamp}]</span><span class="log-tag ${tagClass}">&lt;@${displayName}&gt;</span>${escapeHTML(msg.text)}
                    `;
                    box.appendChild(line);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        window.sendMessage = async function() {
            const textInput = document.getElementById("messageInput");
            const text = textInput.value.trim();
            if(!text || !currentUser) return;

            const myUsername = usersCache[currentUser.uid] || currentUser.email.split('@')[0];

            if (activeChatUserId === "global") {
                await addDoc(collection(db, "global_messages"), {
                    senderId: currentUser.uid,
                    senderName: myUsername,
                    text: text,
                    timestamp: new Date()
                });
            } else {
                const chatId = getChatId(currentUser.uid, activeChatUserId);
                await addDoc(collection(db, "chats", chatId, "messages"), {
                    senderId: currentUser.uid,
                    text: text,
                    timestamp: new Date()
                });
            }

            textInput.value = "";
        };

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
        }
    </script>
</body>
</html>
