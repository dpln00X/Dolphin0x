<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #chatbox { width: 300px; height: 400px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; }
        #userInput { width: 100%; }
    </style>
</head>
<body>

<h1>AI Chatbot</h1>
<div id="chatbox"></div>
<input type="text" id="userInput" placeholder="Type your message here..." />
<button id="sendBtn">Send</button>
<button id="activateBtn">Activate Voice</button>

<script>
    const chatbox = document.getElementById('chatbox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const activateBtn = document.getElementById('activateBtn');

    sendBtn.addEventListener('click', () => {
        const userMessage = userInput.value;
        if (userMessage.trim() === "") {
            alert("Please enter a message.");
            return;
        }
        appendMessage("You: " + userMessage);
        getResponse(userMessage);
        userInput.value = "";
    });

    activateBtn.addEventListener('click', () => {
        // Placeholder for voice activation logic
        appendMessage("Chatbot is now activated for voice interaction.");
    });

    function appendMessage(message) {
        const messageElement = document.createElement('div');
        messageElement.textContent = message;
        chatbox.appendChild(messageElement);
        chatbox.scrollTop = chatbox.scrollHeight; // Auto-scroll to the bottom
    }

    function getResponse(userMessage) {
        try {
            // Simulated response logic
            let response = "I'm not sure how to respond to that.";
            if (userMessage.toLowerCase().includes("hello")) {
                response = "Hello! How can I assist you today?";
            } else if (userMessage.toLowerCase().includes("control")) {
                response = "What would you like to control?";
                // Here you would add logic to communicate with the microcontroller
            }
            appendMessage("Chatbot: " + response);
        } catch (error) {
            console.error("Error occurred while getting response:", error);
            appendMessage("Chatbot: Sorry, I encountered an error while processing your request.");
        }
    }
</script>

</body>
</html>
