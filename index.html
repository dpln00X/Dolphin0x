<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h2 style="color:#fff; margin:0 0 5px 0;">Dolphin0x Netwerk</h2>
        <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom: 25px;">Kies een manier om in te loggen:</p>
        
        <div id="loginEmailSection" style="display:block;">
            <input type="email" id="authEmail" class="auth-input" placeholder="E-mailadres">
            <input type="password" id="authPassword" class="auth-input" placeholder="Wachtwoord">
            <button class="login-btn btn-primary" onclick="loginEmail()">Inloggen met E-mail</button>
        </div>

        <div id="loginPhoneSection" style="margin-top:15px; border-top:1px solid var(--border-color); padding-top:15px;">
            <input type="tel" id="authPhone" class="auth-input" placeholder="Telefoonnummer (bijv. +31612345678)">
            <button class="login-btn btn-phone" onclick="loginWithPhone()">Doorgaan met Telefoon</button>
        </div>

        <div style="margin: 20px 0; color: var(--text-muted); font-size: 0.8rem; display: flex; align-items: center; gap: 10px;">
            <div style="flex:1; height:1px; background:var(--border-color);"></div>
            OF
            <div style="flex:1; height:1px; background:var(--border-color);"></div>
        </div>
        
        <button class="login-btn btn-google" onclick="loginWithGoogle()">🌐 Inloggen met Google</button>
        <button class="login-btn btn-apple" onclick="loginWithApple()">🍏 Inloggen met Apple</button>
        
        <div id="recaptcha-container" style="margin-top:10px;"></div>
    </div>
</div>
