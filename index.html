<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Dolphin0x | Platform</title>
    <style>
        :root { --bg-main: #080f1a; --bg-panel: #111f38; --accent: #2563eb; --text: #f1f5f9; --success: #10b981; }
        body { margin: 0; font-family: sans-serif; background: var(--bg-main); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
        .overlay { position: fixed; inset: 0; background: var(--bg-main); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: var(--bg-panel); padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid #223b63; }
        .input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #223b63; background: #1a2d4c; color: white; }
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; margin: 5px 0; background: var(--accent); color: white; }
        .sidebar { width: 300px; background: var(--bg-panel); border-right: 1px solid #223b63; display: flex; flex-direction: column; }
        .chat-area { flex-grow: 1; display: flex; flex-direction: column; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; cursor: pointer; }
        #videoModal { display: none; position: fixed; inset: 0; background: black; z-index: 10000; padding: 20px; }
        video { width: 45%; height: 300px; background: #222; margin: 10px; }
    </style>
</head>
<body>

    <div id="loginScreen" class="overlay">
        <div class="card">
            <h2>Dolphin0x Login</h2>
            <input type="email" id="email" class="input" placeholder="E-mail">
            <input type="password" id="password" class="input" placeholder="Wachtwoord">
            <button class="btn" onclick="authAction('email')">E-mail Inloggen</button>
            <input type="tel" id="phone" class="input" placeholder="+31 6...">
            <button class="btn" style="background:var(--success)" onclick="authAction('phone')">Telefoon Inloggen</button>
            <button class="btn" style="background:white; color:black" onclick="authAction('google')">Google</button>
            <div id="recaptcha-container"></div>
        </div>
    </div>

    <div id="settingsScreen" class="overlay" style="display:none;">
        <div class="card">
            <h3>Profiel Bewerken</h3>
            <input type="text" id="editName" class="input" placeholder="Naam">
            <input type="text" id="customAvatar" class="input" placeholder="Avatar URL">
            <button class="btn" onclick="saveSettings()">Opslaan</button>
            <button class="btn" style="background:grey" onclick="toggleSettings(false)">Sluiten</button>
        </div>
    </div>

    <div class="sidebar">
        <div style="padding:20px; cursor:pointer;" onclick="toggleSettings(true)">
            <img id="myAvatar" class="avatar" src="">
            <span id="myName" style="margin-left:10px;">Laden...</span>
        </div>
        <button class="btn" onclick="startCall()">Video Bellen</button>
    </div>
    <div class="chat-area">
        <div id="msgList" style="flex-grow:1; padding:20px; overflow-y:auto;"></div>
        <div style="padding:20px; display:flex;">
            <input type="text" id="msgInput" class="input" placeholder="Bericht...">
            <button class="btn" style="width:80px; margin-left:10px;" onclick="send()">Stuur</button>
        </div>
    </div>

    <div id="videoModal">
        <video id="localVideo" autoplay playsinline muted></video>
        <video id="remoteVideo" autoplay playsinline></video>
        <button class="btn" onclick="hangup()">Ophangen</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPhoneNumber, RecaptchaVerifier, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZ0H4mGe6VLzLSb2ow877Xz6j684CwBGU",
            authDomain: "dolphin0x.firebaseapp.com",
            projectId: "dolphin0x",
            storageBucket: "dolphin0x.firebasestorage.app",
            messagingSenderId: "397971950369",
            appId: "1:397971950369:web:06c65ad929479656a10c60"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

        window.toggleSettings = (s) => document.getElementById('settingsScreen').style.display = s ? 'flex' : 'none';

        window.authAction = async (type) => {
            if(type === 'email') {
                try { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); }
                catch { await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); }
            } else if(type === 'google') {
                await signInWithPopup(auth, new GoogleAuthProvider());
            } else {
                window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });
                const conf = await signInWithPhoneNumber(auth, document.getElementById('phone').value, window.recaptchaVerifier);
                const code = prompt("SMS Code:");
                if(code) await conf.confirm(code);
            }
        };

        window.saveSettings = async () => {
            await updateDoc(doc(db, "users", auth.currentUser.uid), { 
                username: document.getElementById('editName').value, 
                avatarUrl: document.getElementById('customAvatar').value 
            });
            toggleSettings(false);
        };

        window.send = async () => {
            const text = document.getElementById('msgInput').value;
            await addDoc(collection(db, "chat"), { text, uid: auth.currentUser.uid, time: Date.now() });
            document.getElementById('msgInput').value = "";
        };

        window.startCall = async () => {
            document.getElementById('videoModal').style.display = 'block';
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = stream;
            stream.getTracks().forEach(t => pc.addTrack(t, stream));
        };

        window.hangup = () => location.reload();

        onAuthStateChanged(auth, async (user) => {
            if(user) {
                document.getElementById('loginScreen').style.display = 'none';
                const ref = doc(db, "users", user.uid);
                if(!(await getDoc(ref)).exists()) await setDoc(ref, { username: "Gebruiker", avatarUrl: "https://api.dicebear.com/7.x/bottts/svg?seed=1" });
                onSnapshot(ref, (s) => {
                    document.getElementById('myName').innerText = s.data().username;
                    document.getElementById('myAvatar').src = s.data().avatarUrl;
                });
            }
        });
    </script>
</body>
</html>
