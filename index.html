<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolphin0x Portal | Secure Network</title>
    <style>
        :root {
            --bg-dark: #020206;
            --panel-bg: #070714;
            --panel-border: #00f2fe;
            --accent-cyan: #00f2fe;
            --accent-pink: #ff007f;
            --text-glow: 0 0 8px #00f2fe;
            --border-glow: 0 0 12px rgba(0, 242, 254, 0.25);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: var(--accent-cyan);
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        /* CRT Scanline Effect */
        body::before {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            z-index: 9999; background-size: 100% 4px; pointer-events: none;
        }

        /* Hoofdvenster */
        .app-container {
            width: 95vw; max-width: 1200px; height: 90vh;
            border: 3px solid var(--panel-border); box-shadow: var(--border-glow);
            background: rgba(2, 2, 6, 0.95); display: flex; flex-direction: column;
        }

        /* Bovenbalk */
        header {
            background: #000; padding: 15px 25px; border-bottom: 3px solid var(--panel-border);
            display: flex; align-items: center; justify-content: space-between; height: 75px;
        }
        .header-title-box { display: flex; align-items: center; gap: 15px; }
        .header-dolphin { width: 45px; height: 45px; filter: drop-shadow(0 0 8px var(--accent-cyan)); }
        header h1 { margin: 0; font-size: 2rem; letter-spacing: 4px; text-shadow: var(--text-glow); text-transform: uppercase; }
        .system-status { border: 1px dashed var(--accent-cyan); padding: 6px 12px; font-size: 0.9rem; font-weight: bold; }

        /* AUTH / LOGIN SCHERM */
        .auth-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; padding: 40px;
        }
        .auth-box {
            background: var(--panel-bg); border: 2px solid var(--panel-border);
            padding: 35px; max-width: 420px; width: 100%; box-shadow: 6px 6px 0px rgba(0, 242, 254, 0.15);
            text-align: center;
        }
        .auth-box h2 { margin-top: 0; letter-spacing: 3px; color: #fff; text-shadow: 0 0 5px var(--accent-cyan); }

        /* DRIE-KOLOMMEN INTERFACE */
        .portal-interface { display: none; flex-grow: 1; height: calc(100% - 75px); }
        
        /* Navigatie & Kanalen (Links) */
        .sidebar {
            width: 30%; max-width: 320px; border-right: 2px solid var(--panel-border);
            background: #04040c; display: flex; flex-direction: column;
        }
        .section-header { 
            padding: 12px 15px; background: rgba(0, 242, 254, 0.08); 
            border-bottom: 2px dashed var(--panel-border); font-weight: bold; font-size: 0.9rem; letter-spacing: 1px;
        }
        
        .channel-list, .user-list { overflow-y: auto; flex-grow: 1; }
        .chat-target-item {
            padding: 15px; border-bottom: 1px solid #111125; cursor: pointer; transition: all 0.15s;
            color: #fff; display: flex; align-items: center; gap: 10px;
        }
        .chat-target-item:hover, .chat-target-item.active {
            background: var(--accent-cyan); color: #000; font-weight: bold;
        }
        .chat-target-item.global { color: var(--accent-pink); font-weight: bold; border-bottom: 2px solid var(--accent-pink); }
        .chat-target-item.global:hover, .chat-target-item.global.active { background: var(--accent-pink); color: #000; }

        /* Centraal Chatscherm (Rechts) */
        .chat-area { width: 70%; flex-grow: 1; display: flex; flex-direction: column; background: #000; }
        .chat-header { 
            padding: 18px; border-bottom: 2px dashed var(--panel-border); 
            font-weight: bold; font-size: 1.1rem; color: #fff; background: var(--panel-bg);
            text-shadow: 0 0 4px var(--accent-cyan);
        }
        .messages-feed { flex-grow: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
        
        /* Chatbubbels met duidelijke outlines */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
        .msg-wrapper.me { align-self: flex-end; }
        .msg-wrapper.them { align-self: flex-start; }
        
        .msg-author { font-size: 0.8rem; color: var(--accent-pink); margin-bottom: 4px; font-weight: bold; padding-left: 2px; }
        .me .msg-author { color: var(--accent-cyan); text-align: right; padding-right: 2px; }

        .msg-bubble { padding: 14px 20px; border: 2px solid var(--panel-border); font-size: 1.05rem; word-wrap: break-word; line-height: 1.4; }
        .me .msg-bubble { background: var(--panel-bg); border-color: var(--accent-cyan); color: #fff; box-shadow: 4px 4px 0px rgba(0, 242, 254, 0.2); }
        .them .msg-bubble { background: #050515; border-color: var(--accent-pink); color: #fff; box-shadow: 4px 4px 0px rgba(255, 0, 127, 0.2); }
        
        .msg-meta { font-size: 0.75rem; color: #555; margin-top: 5px; padding: 0 5px; }
        .me .msg-meta { text-align: right; }

        /* Input Balk */
        .chat-input-bar { padding: 20px; border-top: 2px solid var(--panel-border); display: flex; gap: 15px; background: #03030a; }
        
        input[type="text"], input[type="email"], input[type="password"] {
            background: #000; border: 2px solid var(--accent-cyan); padding: 14px;
            color: #fff; font-family: 'Courier New', monospace; font-size: 1.05rem; outline: none;
        }
        .chat-input-bar input { flex-grow: 1; }
        input:focus { border-color: var(--accent-pink); box-shadow: 0 0 10px var(--accent-pink); }

        /* Grote Duidelijke Knoppen */
        button {
            background: transparent; color: var(--accent-cyan); border: 2px solid var(--accent-cyan);
            padding: 12px 24px; font-family: inherit; font-weight: bold; text-transform: uppercase;
            cursor: pointer; letter-spacing: 1px; font-size: 1rem;
        }
        button:hover { background: var(--accent-cyan); color: #000; box-shadow: 0 0 12px var(--accent-cyan); }
        .btn-pink { color: var(--accent-pink); border-color: var(--accent-pink); }
        .btn-pink:hover { background: var(--accent-pink); color: #000; box-shadow: 0 0 12px var(--accent-pink); }

        .auth-toggle { margin-top: 20px; font-size: 0.9rem; color: #666; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="header-title-box">
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHg3Mnd4cHZhcDN3cmFwZHlsMG10OHl0bTBxdXN4YnY2amN1M3N3MiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/u00507MxtYmSk/giphy.gif" alt="Dolphin" class="header-dolphin">
                <h1>Dolphin0x</h1>
            </div>
            <div id="systemStatus" class="system-status">[ NET_OFFLINE ]</div>
        </header>

        <div id="authScreen" class="auth-screen">
            <div class="auth-box">
                <h2 id="authTitle">LOGIN</h2>
                <div class="input-group" id="usernameGroup" style="display:none; margin-bottom:15px;">
                    <input type="text" id="authUsername" placeholder="CHOOSE CYBERNAME..." style="width:100%;">
                </div>
                <div class="input-group" style="margin-bottom:15px;">
                    <input type="email" id="authEmail" placeholder="ENTER EMAIL..." style="width:100%;">
                </div>
                <div class="input-group" style="margin-bottom:20px;">
                    <input type="password" id="authPassword" placeholder="ENTER ENCRYPTION KEY..." style="width:100%;">
                </div>
                <button style="width:100%;" onclick="handleAuth()">ACCESS PORTAL</button>
                <div id="authToggleText" class="auth-toggle" onclick="toggleAuthMode()">New user? Create an encryption account.</div>
            </div>
        </div>

        <div id="portalInterface" class="portal-interface">
            <div class="sidebar">
                <div class="section-header">🌐 PUBLIC CHANNELS</div>
                <div class="channel-list">
                    <div id="globalChannelItem" class="chat-target-item global active" onclick="selectGlobalChat()">
                        📢 [GLOBAL HOLO-FEED]
                    </div>
                </div>
                
                <div class="section-header">📡 SECURE PRIVATE LINES</div>
                <div id="userList" class="user-list">
                    </div>
                
                <button class="btn-pink" style="margin:15px; border-radius:0; font-size:0.9rem;" onclick="logout()">DISCONNECT</button>
            </div>

            <div class="chat-area">
                <div id="activeChatTarget" class="chat-header">📢 GLOBAL HOLO-FEED (PUBLIC BROADCAST)</div>
                <div id="messagesBox" class="messages-feed"></div>
                <div class="chat-input-bar">
                    <input type="text" id="messageInput" placeholder="TRANSMIT SECURE DATA PACKET..." onkeydown="if(event.key==='Enter') sendMessage()">
                    <button onclick="sendMessage()">TRANSMIT</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDocs, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Jouw officiële Firebase configuratie
        const firebaseConfig = {
            apiKey: "AIzaSyCZ0H4mGe6VLzLSb2ow877Xz6j684CwBGU",
            authDomain: "dolphin0x.firebaseapp.com",
            databaseURL: "https://dolphin0x-default-rtdb.firebaseio.com",
            projectId: "dolphin0x",
            storageBucket: "dolphin0x.firebasestorage.app",
            messagingSenderId: "397971950369",
            appId: "1:397971950369:web:06c65ad929479656a10c60",
            measurementId: "G-KCEJDSHZFL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let activeChatUserId = "global"; // Begint standaard in de openbare chat
        let unsubscribeChat = null;
        let usersCache = {}; // Om namen bij IDs te zoeken in de globale chat

        // --- AUTH LOGICA ---
        window.handleAuth = async function() {
            const email = document.getElementById("authEmail").value.trim();
            const password = document.getElementById("authPassword").value.trim();
            const username = document.getElementById("authUsername").value.trim();
            const isRegister = document.getElementById("authTitle").innerText === "REGISTER";

            if(!email || !password || (isRegister && !username)) {
                alert("ERROR: INVALID INPUT FIELDS."); return;
            }
            if(password.length < 6) {
                alert("ERROR: KEY MUST BE AT LEAST 6 CHARACTERS."); return;
            }

            try {
                if (isRegister) {
                    const res = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", res.user.uid), {
                        uid: res.user.uid,
                        username: username,
                        email: email
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (err) {
                alert("ACCESS DENIED: " + err.message);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById("authScreen").style.display = "none";
                document.getElementById("portalInterface").style.display = "flex";
                document.getElementById("systemStatus").innerText = `[ ONLINE ]`;
                
                // Eerst alle users inladen voor de namen-cache, daarna de chat starten
                await loadUserList();
                selectGlobalChat();
            } else {
                currentUser = null;
                document.getElementById("authScreen").style.display = "flex";
                document.getElementById("portalInterface").style.display = "none";
                document.getElementById("systemStatus").innerText = "[ NET_OFFLINE ]";
            }
        });

        window.logout = function() { signOut(auth); };

        window.toggleAuthMode = function() {
            const title = document.getElementById("authTitle");
            const userGroup = document.getElementById("usernameGroup");
            const toggleText = document.getElementById("authToggleText");
            if (title.innerText === "LOGIN") {
                title.innerText = "REGISTER"; userGroup.style.display = "block";
                toggleText.innerText = "Already registered? Authentication login.";
            } else {
                title.innerText = "LOGIN"; userGroup.style.display = "none";
                toggleText.innerText = "New user? Create an encryption account.";
            }
        };

        // --- SIDEBAR & CHAT SELECTIE ---
        async function loadUserList() {
            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                const userListEl = document.getElementById("userList");
                userListEl.innerHTML = "";
                usersCache = {};

                querySnapshot.forEach((doc) => {
                    const userData = doc.data();
                    usersCache[userData.uid] = userData.username; // Opslaan in cache

                    if(currentUser && userData.uid === currentUser.uid) return; 

                    const item = document.createElement("div");
                    item.className = "chat-target-item";
                    item.id = `user-${userData.uid}`;
                    item.innerText = `📡 @${userData.username}`;
                    item.onclick = () => selectUserChat(userData.uid, userData.username);
                    userListEl.appendChild(item);
                });
            } catch (err) {
                console.error("Error loading users:", err);
            }
        }

        window.selectGlobalChat = function() {
            document.querySelectorAll(".chat-target-item").forEach(el => el.classList.remove("active"));
            document.getElementById("globalChannelItem").classList.add("active");

            activeChatUserId = "global";
            document.getElementById("activeChatTarget").innerText = "📢 GLOBAL HOLO-FEED (PUBLIC BROADCAST)";
            
            loadMessages();
        };

        window.selectUserChat = function(targetUid, targetUsername) {
            document.querySelectorAll(".chat-target-item").forEach(el => el.classList.remove("active"));
            const activeEl = document.getElementById(`user-${targetUid}`);
            if(activeEl) activeEl.classList.add("active");

            activeChatUserId = targetUid;
            document.getElementById("activeChatTarget").innerText = `🔒 SECURE LINE TO: @${targetUsername}`;
            
            loadMessages();
        };

        function getChatId(uid1, uid2) {
            return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`;
        }

        // --- REALTIME CHAT ENGINE ---
        function loadMessages() {
            if (unsubscribeChat) unsubscribeChat();

            let q;
            if (activeChatUserId === "global") {
                // Openbare collectie laden
                q = query(collection(db, "global_messages"), orderBy("timestamp", "asc"));
            } else {
                // Privé collectie tussen twee specifieke UIDs laden
                const chatId = getChatId(currentUser.uid, activeChatUserId);
                q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            }

            unsubscribeChat = onSnapshot(q, (snapshot) => {
                const box = document.getElementById("messagesBox");
                box.innerHTML = "";

                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isMe = msg.senderId === currentUser.uid;
                    
                    // Naam ophalen uit onze cache of fallback naar e-mail/ID
                    let displayName = usersCache[msg.senderId] || msg.senderName || "Unknown_User";
                    if (isMe) displayName = "YOU";

                    const wrapper = document.createElement("div");
                    wrapper.className = `msg-wrapper ${isMe ? 'me' : 'them'}`;
                    
                    wrapper.innerHTML = `
                        <div class="msg-author">@${displayName}</div>
                        <div class="msg-bubble">${escapeHTML(msg.text)}</div>
                        <div class="msg-meta">${msg.timestamp ? new Date(msg.timestamp.toMillis()).toLocaleTimeString('nl-NL', {hour: '2-digit', minute:'2-digit'}) : 'SENDING...'}</div>
                    `;
                    box.appendChild(wrapper);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        window.sendMessage = async function() {
            const textInput = document.getElementById("messageInput");
            const text = textInput.value.trim();
            if(!text || !currentUser) return;

            // Zoek eigen username op
            const myUsername = usersCache[currentUser.uid] || currentUser.email.split('@')[0];

            if (activeChatUserId === "global") {
                // Opslaan in openbare feed
                await addDoc(collection(db, "global_messages"), {
                    senderId: currentUser.uid,
                    senderName: myUsername,
                    text: text,
                    timestamp: new Date()
                });
            } else {
                // Opslaan in privé chat-lijn
                const chatId = getChatId(currentUser.uid, activeChatUserId);
                await addDoc(collection(db, "chats", chatId, "messages"), {
                    senderId: currentUser.uid,
                    text: text,
                    timestamp: new Date()
                });
            }

            textInput.value = "";
        };

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
        }
    </script>
</body>
</html>
