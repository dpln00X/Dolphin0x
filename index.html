<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Dolphin0x | Ultimate Suite</title>
    <style>
        :root { --bg: #050505; --panel: #111; --accent: #2563eb; --text: #fff; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
        
        #app-container { display: none; height: 100vh; grid-template-columns: 260px 1fr; }
        .sidebar { background: #000; padding: 20px; border-right: 1px solid #333; display: flex; flex-direction: column; }
        .chat-view { display: flex; flex-direction: column; height: 100vh; background: var(--panel); }
        .msg-list { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .bubble { background: #1e293b; padding: 12px; border-radius: 12px; margin-bottom: 10px; width: fit-content; }
        
        .auth-overlay { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .card { background: #111; padding: 40px; border-radius: 20px; width: 320px; text-align: center; border: 1px solid #333; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; cursor: pointer; background: var(--accent); color: white; font-weight: bold; }
        
        #call-ui { display: none; position: fixed; inset: 0; background: #000; z-index: 5000; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="auth-overlay" class="auth-overlay">
        <div class="card">
            <h2>Dolphin0x Connect</h2>
            <input type="email" id="email" placeholder="E-mail">
            <input type="password" id="pass" placeholder="Wachtwoord">
            <button class="btn" onclick="handleAuth(true)">Inloggen</button>
            <button class="btn" style="background:#444;" onclick="handleAuth(false)">Registreren</button>
            <button class="btn" style="background:#db4437;" onclick="handleGoogle()">Google Login</button>
        </div>
    </div>

    <div id="app-container">
        <div class="sidebar">
            <h3>Kamers</h3>
            <div id="room-list">
                <div onclick="switchRoom('global')" style="cursor:pointer; padding:5px;"># Algemeen</div>
            </div>
            <button class="btn" onclick="createGroup()">+ Nieuwe Groep</button>
            <button class="btn" onclick="startCall()">📞 Videobellen</button>
        </div>
        <div class="chat-view">
            <h3 id="room-title" style="padding-left: 20px;"># Algemeen</h3>
            <div id="msg-list" class="msg-list"></div>
            <div style="padding:20px; display:flex; gap:10px; background:#000;">
                <input type="text" id="msg-input" placeholder="Type een bericht..." style="flex-grow:1; padding:10px; border-radius:5px; border:none; background:#222; color:white;">
                <button onclick="sendMsg()">Stuur</button>
                <button onclick="translateMsg()">🌍 Vertaal</button>
            </div>
        </div>
    </div>

    <div id="call-ui">
        <video id="localVid" autoplay playsinline muted></video>
        <button class="btn" style="background:red; width:150px;" onclick="hangup()">Ophangen</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZ0H4mGe6VLzLSb2ow877Xz6j684CwBGU",
            authDomain: "dolphin0x.firebaseapp.com",
            projectId: "dolphin0x",
            storageBucket: "dolphin0x.firebasestorage.app",
            messagingSenderId: "397971950369",
            appId: "1:397971950369:web:06c65ad929479656a10c60"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let activeRoom = 'global';

        window.handleAuth = async (isLogin) => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try {
                isLogin ? await signInWithEmailAndPassword(auth, e, p) : await createUserWithEmailAndPassword(auth, e, p);
            } catch(err) { alert(err.message); }
        };

        window.handleGoogle = () => signInWithPopup(auth, new GoogleAuthProvider());

        onAuthStateChanged(auth, user => {
            if (user) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('app-container').style.display = 'grid';
                loadMsgs();
            }
        });

        window.switchRoom = (r) => { activeRoom = r; document.getElementById('room-title').innerText = '# ' + r; loadMsgs(); };
        window.createGroup = () => { const name = prompt("Groepsnaam:"); if(name) switchRoom(name); };

        window.sendMsg = async () => {
            const input = document.getElementById('msg-input');
            if(!input.value) return;
            await addDoc(collection(db, "messages"), { text: input.value, room: activeRoom, sender: auth.currentUser.email, timestamp: serverTimestamp() });
            input.value = '';
        };

        function loadMsgs() {
            onSnapshot(query(collection(db, "messages"), where("room", "==", activeRoom), orderBy("timestamp")), (snap) => {
                const list = document.getElementById('msg-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    list.innerHTML += `<div class="bubble"><b>${d.data().sender}:</b> ${d.data().text}</div>`;
                });
            });
        }

        window.startCall = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('call-ui').style.display = 'flex';
            document.getElementById('localVid').srcObject = stream;
        };

        window.hangup = () => { document.getElementById('call-ui').style.display = 'none'; document.getElementById('localVid').srcObject.getTracks().forEach(t => t.stop()); };
        window.translateMsg = () => alert("Vertaal-service gekoppeld aan vertaal-API...");
    </script>
</body>
</html>
