<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Dolphin0x - Full Suite</title>
    <style>
        /* Voeg deze CSS toe voor video-berichten in de chat */
        .video-embed { width: 100%; max-width: 300px; border-radius: 10px; margin-top: 5px; }
        .chat-bubble { padding: 12px; border-radius: 12px; margin: 5px; background: #1a2d4c; }
    </style>
</head>
<body>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZ0H4mGe6VLzLSb2ow877Xz6j684CwBGU",
            authDomain: "dolphin0x.firebaseapp.com",
            projectId: "dolphin0x",
            storageBucket: "dolphin0x.firebasestorage.app",
            messagingSenderId: "397971950369",
            appId: "1:397971950369:web:06c65ad929479656a10c60"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // --- 1. CHAT & VIDEO POSTEN ---
        window.sendMessage = async function(text, isVideo = false) {
            const chatCollection = collection(db, "global_chat");
            await addDoc(chatCollection, {
                text: text,
                isVideo: isVideo, // True als het een video link is
                senderId: auth.currentUser.uid,
                timestamp: serverTimestamp()
            });
        };

        // --- 2. VIDEO POST FUNCTIE ---
        window.postVideo = function() {
            const url = prompt("Plak hier de YouTube of MP4 video link:");
            if (url) window.sendMessage(url, true);
        };

        // --- 3. RENDERING LOGICA ---
        // Pas je onSnapshot aan om video's anders te tonen:
        function renderMessages(messages) {
            const container = document.getElementById("chatMessages");
            messages.forEach(m => {
                if (m.isVideo) {
                    container.innerHTML += `<div class="chat-bubble">
                        <video class="video-embed" controls src="${m.text}"></video>
                    </div>`;
                } else {
                    container.innerHTML += `<div class="chat-bubble">${m.text}</div>`;
                }
            });
        }

        // --- 4. BELLEN (WEBRTC) ---
        window.startCall = async function() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById("localVideo").srcObject = stream;
            // PeerConnection logica initialiseren...
            alert("Verbinding maken met andere gebruiker...");
        };

    </script>
</body>
</html>
