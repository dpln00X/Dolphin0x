<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dolphin0x | Unlimited iPad AI</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 0; background-color: #0f172a; color: #e2e8f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .chat-container { width: 100%; max-width: 750px; height: 95vh; background-color: #1e293b; border-radius: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.4); overflow: hidden; border: 1px solid #334155; }
        
        .chat-header { padding: 16px 20px; background-color: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .chat-header h2 { margin: 0; font-size: 1.3rem; color: #38bdf8; font-weight: 700; }
        
        .controls { display: flex; align-items: center; gap: 15px; }
        .toggle-container { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 600; color: #94a3b8; }
        
        /* Premium Switch Button */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #a855f7; }
        input:checked + .slider:before { transform: translateX(20px); }

        #status { font-size: 0.85rem; color: #e2e8f0; background: #334155; padding: 6px 12px; border-radius: 20px; font-weight: 600; }
        .chat-log { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background-color: #0f172a; }
        
        .msg { max-width: 85%; padding: 14px 18px; border-radius: 18px; line-height: 1.6; font-size: 1rem; white-space: pre-line; }
        .msg.user { align-self: flex-end; background-color: #38bdf8; color: #0f172a; font-weight: 500; border-bottom-right-radius: 4px; }
        .msg.ai { align-self: flex-start; background-color: #1e293b; color: #e2e8f0; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        .msg.system { align-self: center; background-color: #334155; color: #cbd5e1; font-size: 0.85rem; border-radius: 10px; padding: 6px 14px; text-align: center; max-width: 90%; }

        .input-area { padding: 20px; background-color: #1e293b; display: flex; gap: 12px; border-top: 1px solid #334155; align-items: center; }
        .text-input { flex-grow: 1; background-color: #0f172a; border: 1px solid #334155; border-radius: 30px; padding: 0 20px; color: white; font-size: 1rem; height: 48px; outline: none; }
        .text-input:focus { border-color: #38bdf8; }
        
        .btn { height: 44px; padding: 0 20px; border: none; border-radius: 22px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .btn-send { background-color: #38bdf8; color: #0f172a; }
        .btn-clear { background-color: #475569; color: white; }
        .btn-mic { width: 48px; height: 48px; border-radius: 50%; background-color: #22c55e; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; border: none; cursor: pointer; padding: 0; }
        .btn-mic.listening { background-color: #ef4444; animation: pulse 1s infinite alternate; }

        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>Dolphin0x Realtime AI</h2>
            <div class="controls">
                <div class="toggle-container">
                    <span>🌐 Internet Zoeken</span>
                    <label class="switch">
                        <input type="checkbox" id="internetToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <span id="status">Standby</span>
            </div>
        </div>

        <div id="chatLog" class="chat-log">
            <div class="msg ai">Dolphin0x is opgestart via Puter.js! 🚀 

Ik kan nu op **alles** reageren wat je vraagt. Als je de schakelaar 'Internet Zoeken' aan laat staan, haal ik live informatie van het web voor actuele vragen. Klik op de microfoon om te praten!</div>
        </div>

        <div class="input-area">
            <button id="micBtn" class="btn btn-mic" onclick="toggleVoice()">🎙️</button>
            <input type="text" id="userInput" class="text-input" placeholder="Stel een vraag over alles..." onkeypress="handleEnter(event)">
            <button class="btn btn-send" onclick="sendText()">Stuur</button>
            <button class="btn btn-clear" onclick="clearLogs()">🗑️</button>
        </div>
    </div>

    <script>
        const synth = window.speechSynthesis;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = SpeechRecognition ? new SpeechRecognition() : null;

        // Dit houdt het lopende gesprek live bij in het geheugen
        let conversationHistory = [
            { role: "system", content: "Je bent Dolphin0x, een slimme, behulpzame AI-assistent gebouwd voor een creatieve programmeur en scholier op een iPad. Antwoord altijd in vloeiend, natuurlijk Nederlands. Wees to-the-point maar geef complete antwoorden. Het huidige jaar is 2026. Als de gebruiker internet-context meestuurt, gebruik die dan om accuraat te antwoorden." }
        ];

        if (recognition) {
            recognition.lang = 'nl-NL';
            recognition.interimResults = false;
            recognition.onstart = () => setStatus("Luisteren...", "listening");
            recognition.onend = () => setStatus("Standby");
            recognition.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                sendText();
            };
        }

        function handleEnter(e) { if (e.key === 'Enter') sendText(); }

        async function sendText() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            printMessage('user', text);
            
            await processAI(text);
        }

        // De internet-scraper via een gratis, sleutelloos CORS-tussenstation
        async function scrapeWeb(query) {
            setStatus("Internet afzoeken...");
            try {
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(`https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`)}`;
                const response = await fetch(proxyUrl);
                if (!response.ok) return null;
                
                const html = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const results = doc.querySelectorAll('.result__body');
                
                let snippets = [];
                results.forEach((res, index) => {
                    if (index < 3) { // Pak de top 3 beste resultaten van het web
                        const title = res.querySelector('.result__title')?.innerText?.trim() || '';
                        const snippet = res.querySelector('.result__snippet')?.innerText?.trim() || '';
                        if (snippet) snippets.push(`- ${title}: ${snippet}`);
                    }
                });
                return snippets.length > 0 ? snippets.join("\n") : null;
            } catch (err) {
                console.error("Scrape fout:", err);
                return null;
            }
        }

        async function processAI(userPrompt) {
            setStatus("Nadenken...");
            const useInternet = document.getElementById('internetToggle').checked;
            let finalPrompt = userPrompt;

            // Als internet aanstaat, halen we live data op voordat we de AI aanroepen
            if (useInternet) {
                const webData = await scrapeWeb(userPrompt);
                if (webData) {
                    printSystem("Live internetdata toegevoegd aan brein.");
                    finalPrompt = `[GEBRUIK DEZE LIVE INTERNET INFORMATIE OM DE VRAAG TE BEANTWOORDEN]:\n${webData}\n\n[VRAAG GEBRUIKER]:\n${userPrompt}`;
                }
            }

            // Voeg de vraag toe aan de geschiedenis
            conversationHistory.push({ role: "user", content: finalPrompt });

            try {
                setStatus("Antwoord genereren...");
                // We roepen Puter AI aan zonder keys! We gebruiken het betrouwbare gpt-4o-mini model
                const response = await puter.ai.chat(conversationHistory, { model: 'openai/gpt-4o-mini' });
                
                // Veilig de tekst uit de Puter-respons vissen
                let aiReply = "";
                if (typeof response === 'string') aiReply = response;
                else if (response?.message?.content) aiReply = response.message.content;
                else if (response?.text) aiReply = response.text;
                else aiReply = JSON.stringify(response);

                // Voeg het antwoord van de AI toe aan de geschiedenis zodat hij de context onthoudt
                conversationHistory.push({ role: "assistant", content: aiReply });

                printMessage('ai', aiReply);
                speak(aiReply);
            } catch (error) {
                console.error(error);
                printMessage('ai', "Er ging iets mis bij het praten met het AI-netwerk. Probeer het nog eens!");
            }
            setStatus("Standby");
        }

        // Hardop praten via de iPad-luidspreker
        function speak(text) {
            if (!synth) return;
            synth.cancel();
            
            // Haal vreemde tekens weg voor een vloeiende stem
            const cleanText = text.replace(/[•*#_-]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'nl-NL';
            utterance.rate = 1.05; 
            synth.speak(utterance);
        }

        function toggleVoice() {
            if (!recognition) { alert("Spraakherkenning wordt niet ondersteund in deze browserversie."); return; }
            if (synth.speaking) synth.cancel();
            recognition.start();
        }

        function printMessage(role, text) {
            const log = document.getElementById('chatLog');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerText = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function printSystem(text) {
            const log = document.getElementById('chatLog');
            const div = document.createElement('div');
            div.className = 'msg system';
            div.innerText = `🌐 Sync: ${text}`;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function setStatus(text, cssClass = "") {
            document.getElementById('status').innerText = text;
            const mic = document.getElementById('micBtn');
            if (cssClass === "listening") { mic.classList.add('listening'); } else { mic.classList.remove('listening'); }
        }

        function clearLogs() {
            document.getElementById('chatLog').innerHTML = '<div class="msg ai">Gesprek gewist. Stel me een nieuwe vraag!</div>';
            conversationHistory = [conversationHistory[0]]; // Reset geschiedenis behalve systeem prompt
            if (synth) synth.cancel();
            setStatus("Standby");
        }
    </script>
</body>
</html>
