<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolphin0x - Auth, Chat & Call</title>
    <style>
        :root {
            --bg-main: #0b1528;
            --bg-panel: #111f38;
            --bg-input: #1a2d4c;
            --border-color: #223b63;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #2563eb;
            --accent-hover: #3b82f6;
            --accent-light: rgba(37, 99, 235, 0.2);
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 0; background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Login Scherm Overlay */
        .login-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-main); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .login-card { background: var(--bg-panel); border: 1px solid var(--border-color); padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); text-align: center; max-width: 400px; width: 90%; }
        .login-btn { width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; font-size: 1rem; transition: background 0.2s; }
        .btn-google { background: #ffffff; color: #000000; }
        .btn-google:hover { background: #f1f5f9; }
        .btn-apple { background: #000000; color: #ffffff; }
        .btn-apple:hover { background: #1e293b; }

        /* App Layout */
        .sidebar { width: 320px; background: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 10; }
        .profile-bar { padding: 20px; border-bottom: 1px solid var(--border-color); background: linear-gradient(135deg, #112547, #17325c); display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar-sm { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); background: #1a2d4c; }
        .username { font-weight: 700; font-size: 1rem; color: #ffffff; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .sidebar-title { padding: 15px 20px 5px 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; }
        .list-container { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .user-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-bottom: 4px; border: 1px solid transparent; }
        .user-item:hover { background: var(--bg-input); border-color: var(--border-color); }
        .user-item.active { background: var(--accent-light); border-color: var(--accent); }

        button { background: var(--accent); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
        button:hover { background: var(--accent-hover); }
        .btn-call { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; font-size: 1.1rem; background: var(--success); }
        .btn-call:hover { background: #34d399; }
        .btn-danger { background: var(--danger); }
        .btn-logout { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); padding: 4px 8px; font-size: 0.75rem; }
        .btn-logout:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

        /* Chatvenster */
        .chat-area { flex-grow: 1; display: flex; flex-direction: column; background: #080f1a; position: relative; }
        .chat-blank { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); gap: 10px; }
        .chat-header { background: var(--bg-panel); padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; font-weight: 700; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .chat-messages { flex-grow: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .chat-bubble { padding: 12px 16px; border-radius: 14px; max-width: 60%; font-size: 0.95rem; word-wrap: break-word; line-height: 1.4; }
        .chat-bubble.me { background: var(--accent); color: white; align-self: flex-end; border-top-right-radius: 2px; }
        .chat-bubble.them { background: var(--bg-panel); color: var(--text-main); align-self: flex-start; border-top-left-radius: 2px; border: 1px solid var(--border-color); }
        
        .chat-input-bar { padding: 16px 24px; background: var(--bg-panel); display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--border-color); }
        .chat-input-bar input { flex-grow: 1; padding: 12px 18px; border-radius: 24px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-main); outline: none; font-size: 0.95rem; }

        /* Calling Overlay */
        .call-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(5,11,22,0.96); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .video-grid { display: flex; gap: 20px; margin-bottom: 30px; width: 85%; max-width: 950px; }
        .video-box { flex: 1; background: #111f38; border-radius: 12px; overflow: hidden; height: 420px; position: relative; border: 2px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .video-box video { width: 100%; height: 100%; object-fit: cover; background: #111f38; }
        .video-label { position: absolute; bottom: 12px; left: 12px; background: rgba(11,21,40,0.8); padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; border: 1px solid var(--border-color); }
        .call-controls { display: flex; gap: 20px; }
        .btn-hangup { width: 50px; height: 50px; border-radius: 50%; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; padding: 0; }
    </style>
</head>
<body>

    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <h2 style="margin-top:0; color:#fff;">Dolphin0x Network</h2>
            <p style="color:var(--text-muted); margin-bottom: 30px;">Log veilig in met je Google- of Apple-account om te chatten en bellen.</p>
            
            <button class="login-btn btn-google" onclick="loginWithGoogle()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="18" alt="">
                Inloggen met Google
            </button>
            
            <button class="login-btn btn-apple" onclick="loginWithApple()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" width="16" style="filter:invert(1);" alt="">
                Inloggen met Apple
            </button>
        </div>
    </div>

    <div class="sidebar">
        <div class="profile-bar">
            <div class="user-info">
                <img id="myAvatar" src="https://www.w3schools.com/howto/img_avatar.png" class="avatar-sm">
                <div>
                    <div id="myName" class="username">Laden...</div>
                    <button class="btn-logout" onclick="logout()" style="margin-top:4px;">Log uit</button>
                </div>
            </div>
        </div>

        <div class="sidebar-title">Actieve Leden</div>
        <div id="userListContainer" class="list-container"></div>
    </div>

    <div class="chat-area">
        <div id="chatBlank" class="chat-blank">
            <span style="font-size: 3rem;">⚡</span>
            <p>Kies een online gebruiker om een gesprek of call te starten.</p>
        </div>

        <div id="chatActiveBox" style="display: none; flex-direction: column; height: 100%;">
            <div class="chat-header">
                <img id="chatTargetAvatar" src="https://www.w3schools.com/howto/img_avatar.png" class="avatar-sm" style="width:32px; height:32px;">
                <span id="chatTargetName">Gebruiker</span>
            </div>
            
            <div id="chatMessages" class="chat-messages"></div>
            
            <div class="chat-input-bar">
                <input type="text" id="chatMessageInput" placeholder="Typ een bericht..." onkeydown="if(event.key==='Enter') sendDirectMessage()">
                <button onclick="sendDirectMessage()">Verstuur</button>
            </div>
        </div>
    </div>

    <div id="callOverlay" class="call-overlay">
        <h2 id="callStatusText">Oproep starten...</h2>
        <div class="video-grid">
            <div class="video-box">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label">Jij</div>
            </div>
            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label" id="remoteVideoLabel">Ander</div>
            </div>
        </div>
        <div class="call-controls">
            <button class="btn-danger btn-hangup" onclick="hangUpCall()">✕</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, OAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, setDoc, updateDoc, query, orderBy, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZ0H4mGe6VLzLSb2ow877Xz6j684CwBGU",
            authDomain: "dolphin0x.firebaseapp.com",
            databaseURL: "https://dolphin0x-default-rtdb.firebaseio.com",
            projectId: "dolphin0x",
            storageBucket: "dolphin0x.firebasestorage.app",
            messagingSenderId: "397971950369",
            appId: "1:397971950369:web:06c65ad929479656a10c60"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let activeChatUid = null;
        let usersCache = {};
        let unsubscribeChat = null;

        // WebRTC Config & STUN Google Servers
        let localStream = null;
        let remoteStream = null;
        let peerConnection = null;
        let activeCallId = null;
        const servers = { iceServers: [{ urls: ['ice1.l.google.com:19002', 'ice2.l.google.com:19002'] }], iceCandidatePoolSize: 10 };

        // 1. AUTHENTICATIE STATUS CHECK
        onAuthStateChanged(auth, async (user) => {
            const loginOverlay = document.getElementById("loginOverlay");
            if (user) {
                currentUser = user;
                loginOverlay.style.display = "none"; // Verberg login

                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);
                
                // Als de gebruiker nieuw is, sla de Google/Apple naam en foto op
                if (!userDoc.exists()) {
                    await setDoc(userDocRef, {
                        uid: user.uid,
                        username: user.displayName || user.email.split('@')[0],
                        avatarUrl: user.photoURL || "https://www.w3schools.com/howto/img_avatar.png"
                    });
                }

                // Haal alle actieve gebruikers realtime op
                onSnapshot(collection(db, "users"), (snapshot) => {
                    usersCache = {};
                    snapshot.forEach(d => usersCache[d.id] = d.data());
                    
                    if(usersCache[currentUser.uid]) {
                        document.getElementById("myName").innerText = usersCache[currentUser.uid].username;
                        document.getElementById("myAvatar").src = usersCache[currentUser.uid].avatarUrl;
                    }
                    renderUserList();
                });

                listenForIncomingCalls();
            } else {
                currentUser = null;
                loginOverlay.style.display = "flex"; // Toon login
            }
        });

        // INLOG METHODES
        window.loginWithGoogle = function() {
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider).catch(err => alert("Google Login Fout: " + err.message));
        };

        window.loginWithApple = function() {
            const provider = new OAuthProvider('apple.com');
            signInWithPopup(auth, provider).catch(err => alert("Apple Login Fout: " + err.message));
        };

        window.logout = function() {
            if(confirm("Weet je zeker dat je wilt uitloggen?")) {
                signOut(auth).then(() => location.reload());
            }
        };

        // 2. GEBRUIKERS EN CONTACTEN LIJST
        function renderUserList() {
            const container = document.getElementById("userListContainer");
            container.innerHTML = "";

            Object.keys(usersCache).forEach(uid => {
                if (uid === currentUser.uid) return;
                const u = usersCache[uid];

                const item = document.createElement("div");
                item.className = `user-item ${activeChatUid === uid ? 'active' : ''}`;
                
                item.innerHTML = `
                    <div class="user-info">
                        <img src="${u.avatarUrl}" class="avatar-sm" style="width:30px; height:30px;">
                        <span style="font-weight:600;">${u.username}</span>
                    </div>
                    <button class="btn-call" onclick="startCall('${uid}')">📞</button>
                `;
                
                item.addEventListener('click', (e) => {
                    if(e.target.tagName !== 'BUTTON') openChat(uid);
                });

                container.appendChild(item);
            });
        }

        // 3. REALTIME PRIVÉ CHAT
        function openChat(targetUid) {
            activeChatUid = targetUid;
            document.getElementById("chatBlank").style.display = "none";
            document.getElementById("chatActiveBox").style.display = "flex";
            
            document.getElementById("chatTargetName").innerText = usersCache[targetUid].username;
            document.getElementById("chatTargetAvatar").src = usersCache[targetUid].avatarUrl;

            if(unsubscribeChat) unsubscribeChat();

            const chatId = currentUser.uid < targetUid ? `${currentUser.uid}_${targetUid}` : `${targetUid}_${currentUser.uid}`;
            const q = query(collection(db, "direct_chats", chatId, "messages"), orderBy("timestamp", "asc"));

            unsubscribeChat = onSnapshot(q, (snapshot) => {
                const msgBox = document.getElementById("chatMessages");
                msgBox.innerHTML = "";
                snapshot.forEach(d => {
                    const m = d.data();
                    const isMe = m.senderId === currentUser.uid;
                    msgBox.innerHTML += `<div class="chat-bubble ${isMe ? 'me' : 'them'}">${escapeHTML(m.text)}</div>`;
                });
                msgBox.scrollTop = msgBox.scrollHeight;
            });

            renderUserList();
        }

        window.sendDirectMessage = async function() {
            const input = document.getElementById("chatMessageInput");
            const text = input.value.trim();
            if(!text || !activeChatUid) return;

            const chatId = currentUser.uid < activeChatUid ? `${currentUser.uid}_${activeChatUid}` : `${activeChatUid}_${currentUser.uid}`;
            await addDoc(collection(db, "direct_chats", chatId, "messages"), {
                senderId: currentUser.uid,
                text: text,
                timestamp: new Date()
            });
            input.value = "";
        };

        // 4. VERBETERDE WEBRTC BELLEN
        window.startCall = async function(targetUid) {
            document.getElementById("callOverlay").style.display = "flex";
            document.getElementById("callStatusText").innerText = "Oproep verzenden...";

            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            remoteStream = new MediaStream();

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.ontrack = event => event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));

            document.getElementById("localVideo").srcObject = localStream;
            document.getElementById("remoteVideo").srcObject = remoteStream;

            const callDocRef = doc(collection(db, "calls"));
            activeCallId = callDocRef.id;

            peerConnection.onicecandidate = event => {
                if (event.candidate) addDoc(collection(callDocRef, "callerCandidates"), event.candidate.toJSON());
            };

            const offerDescription = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offerDescription);

            await setDoc(callDocRef, {
                offer: { type: offerDescription.type, sdp: offerDescription.sdp },
                caller: currentUser.uid,
                receiver: targetUid,
                status: "ringing"
            });

            onSnapshot(callDocRef, async (snapshot) => {
                const data = snapshot.data();
                if (data?.answer && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                    document.getElementById("callStatusText").innerText = "In gesprek";
                }
                if (data?.status === "ended") closeCallUI();
            });

            onSnapshot(collection(callDocRef, "receiverCandidates"), snapshot => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                });
            });
        };

        function listenForIncomingCalls() {
            peerConnection = new RTCPeerConnection(servers);

            onSnapshot(collection(db, "calls"), snapshot => {
                snapshot.docChanges().forEach(async change => {
                    if (change.type === 'added' || change.type === 'modified') {
                        const callData = change.doc.data();
                        if (callData.receiver === currentUser.uid && callData.status === "ringing") {
                            activeCallId = change.doc.id;
                            const callerName = usersCache[callData.caller]?.username || "Iemand";
                            
                            if(confirm(`Inkomende oproep van ${callerName}! Opnemen?`)) {
                                acceptIncomingCall(change.doc.ref, callData);
                            } else {
                                await updateDoc(change.doc.ref, { status: "ended" });
                            }
                        }
                    }
                });
            });
        }

        async function acceptIncomingCall(callDocRef, callData) {
            document.getElementById("callOverlay").style.display = "flex";
            document.getElementById("callStatusText").innerText = "Verbinden...";

            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            remoteStream = new MediaStream();

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.ontrack = event => event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));

            document.getElementById("localVideo").srcObject = localStream;
            document.getElementById("remoteVideo").srcObject = remoteStream;

            peerConnection.onicecandidate = event => {
                if (event.candidate) addDoc(collection(callDocRef, "receiverCandidates"), event.candidate.toJSON());
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
            const answerDescription = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answerDescription);

            await updateDoc(callDocRef, {
                answer: { type: answerDescription.type, sdp: answerDescription.sdp },
                status: "active"
            });

            onSnapshot(collection(callDocRef, "callerCandidates"), snapshot => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                });
            });

            onSnapshot(callDocRef, snapshot => {
                if (snapshot.data()?.status === "ended") closeCallUI();
            });
        }

        window.hangUpCall = async function() {
            if(activeCallId) await updateDoc(doc(db, "calls", activeCallId), { status: "ended" });
            closeCallUI();
        };

        function closeCallUI() {
            document.getElementById("callOverlay").style.display = "none";
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            if (peerConnection) peerConnection.close();
            peerConnection = new RTCPeerConnection(servers);
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
        }
    </script>
</body>
</html>
