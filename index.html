<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolphin0x | Ultimate Suite</title>
    <style>
        :root { --bg: #050505; --panel: #111; --accent: #2563eb; --text: #e2e8f0; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; height: 100vh; overflow: hidden; }
        
        /* Auth Screen */
        #auth-screen { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .card { background: var(--panel); padding: 40px; border-radius: 20px; width: 320px; border: 1px solid #333; }
        
        /* Dashboard Layout */
        #app-container { display: none; height: 100vh; grid-template-columns: 280px 1fr; }
        .sidebar { background: #000; padding: 20px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #222; }
        .chat-main { display: flex; flex-direction: column; background: var(--panel); }
        .msg-list { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        
        /* UI Elements */
        .msg-bubble { background: #1e293b; padding: 12px; border-radius: 12px; margin-bottom: 10px; max-width: 70%; }
        .btn { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: none; cursor: pointer; background: var(--accent); color: white; font-weight: bold; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; display: inline-block; }
        
        /* Video UI */
        #call-ui { display: none; position: fixed; inset: 0; background: #000; z-index: 5000; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="card">
            <h2 style="text-align:center;">Dolphin0x Login</h2>
            <input type="email" id="email" placeholder="E-mail" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:none;">
            <input type="password" id="pass" placeholder="Wachtwoord" style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:none;">
            <button class="btn" onclick="handleAuth(true)">Inloggen</button>
            <button class="btn" style="background:#444;" onclick="handleAuth(false)">Registreren</button>
            <button class="btn" style="background:#db4437;" onclick="googleLogin()">Google Login</button>
        </div>
    </div>

    <div id="app-container">
        <div class="sidebar">
            <h3>Dolphin0x</h3>
            <div id="room-list">
                <div onclick="switchRoom('global')" style="cursor:pointer; padding:5px;"># Algemeen</div>
            </div>
            <button class="btn" onclick="createGroup()">+ Nieuwe Groep</button>
            <button class="btn" onclick="startCall()">📞 Video Bellen</button>
            <div id="status-panel" style="margin-top:auto; font-size:0.8rem; color:#666;"></div>
        </div>
        <div class="chat-main">
            <div id="msg-list" class="msg-list"></div>
            <div style="padding:20px; display:flex; gap:10px;">
                <input type="text" id="msg-input" placeholder="Type een bericht..." style="flex-grow:1; padding:10px; border-radius:5px; border:none;">
                <button class="btn" style="width:80px; margin:0;" onclick="sendMessage()">Stuur</button>
                <button class="btn" style="width:100px; margin:0; background:#333;" onclick="translateMsg()">🌍 Vertaal</button>
            </div>
        </div>
    </div>

    <div id="call-ui">
        <video id="localVid" autoplay playsinline muted></video>
        <button class="btn" style="background:red; width:150px;" onclick="hangup()">Ophangen</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZ0H4mGe6VLzLSb2ow877Xz6j684CwBGU",
            authDomain: "dolphin0x.firebaseapp.com",
            projectId: "dolphin0x",
            storageBucket: "dolphin0x.firebasestorage.app",
            messagingSenderId: "397971950369",
            appId: "1:397971950369:web:06c65ad929479656a10c60"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let activeRoom = 'global';

        // AUTH & GOOGLE
        window.handleAuth = async (isLogin) => {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try {
                isLogin ? await signInWithEmailAndPassword(auth, e, p) : await createUserWithEmailAndPassword(auth, e, p);
            } catch(err) { alert(err.message); }
        };

        window.googleLogin = () => signInWithPopup(auth, new GoogleAuthProvider());

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'grid';
            }
        });

        // CHAT & GROEPEN
        window.switchRoom = (r) => { activeRoom = r; loadMsgs(); };
        window.createGroup = () => { const name = prompt("Naam nieuwe groep:"); if(name) switchRoom(name); };
        
        window.sendMessage = async () => {
            const input = document.getElementById('msg-input');
            if(!input.value) return;
            await addDoc(collection(db, "messages"), { text: input.value, room: activeRoom, sender: auth.currentUser.email, timestamp: serverTimestamp() });
            input.value = '';
        };

        function loadMsgs() {
            onSnapshot(query(collection(db, "messages"), where("room", "==", activeRoom), orderBy("timestamp")), (snap) => {
                const list = document.getElementById('msg-list');
                list.innerHTML = '';
                snap.forEach(d => list.innerHTML += `<div class="msg-bubble"><b>${d.data().sender}:</b> ${d.data().text}</div>`);
            });
        }

        // VERTALER & BELLEN
        window.translateMsg = () => alert("Vertaling naar Engels actief...");
        window.startCall = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('call-ui').style.display = 'flex';
            document.getElementById('localVid').srcObject = stream;
        };
        window.hangup = () => { document.getElementById('call-ui').style.display = 'none'; document.getElementById('localVid').srcObject.getTracks().forEach(t => t.stop()); };
        
        loadMsgs();
    </script>
</body>
</html>
