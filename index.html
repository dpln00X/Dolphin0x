<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dolphin0x | Smart iPad AI</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 0; background-color: #0f172a; color: #e2e8f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .chat-container { width: 100%; max-width: 650px; height: 95vh; background-color: #1e293b; border-radius: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.4); overflow: hidden; border: 1px solid #334155; }
        
        .chat-header { padding: 20px; background-color: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .chat-header h2 { margin: 0; font-size: 1.4rem; color: #38bdf8; font-weight: 700; }
        
        #status { font-size: 0.85rem; color: #94a3b8; background: #334155; padding: 6px 12px; border-radius: 20px; font-weight: 600; }
        .chat-log { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; background-color: #0f172a; }
        
        .msg { max-width: 80%; padding: 14px 18px; border-radius: 18px; line-height: 1.6; font-size: 1rem; white-space: pre-line; }
        .msg.user { align-self: flex-end; background-color: #38bdf8; color: #0f172a; font-weight: 500; border-bottom-right-radius: 4px; }
        .msg.ai { align-self: flex-start; background-color: #1e293b; color: #e2e8f0; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        .msg.system { align-self: center; background-color: #334155; color: #94a3b8; font-size: 0.85rem; border-radius: 10px; padding: 6px 14px; text-align: center; }

        .input-area { padding: 20px; background-color: #1e293b; display: flex; gap: 12px; border-top: 1px solid #334155; align-items: center; }
        .text-input { flex-grow: 1; background-color: #0f172a; border: 1px solid #334155; border-radius: 30px; padding: 0 20px; color: white; font-size: 1rem; height: 48px; outline: none; }
        .text-input:focus { border-color: #38bdf8; }
        
        .btn { height: 44px; padding: 0 20px; border: none; border-radius: 22px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; }
        .btn-send { background-color: #38bdf8; color: #0f172a; }
        .btn-clear { background-color: #475569; color: white; }
        .btn-mic { width: 48px; height: 48px; border-radius: 50%; background-color: #22c55e; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; border: none; cursor: pointer; padding: 0; }
        .btn-mic.listening { background-color: #ef4444; animation: pulse 1s infinite alternate; }

        @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.08); } }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h2>Dolphin0x Companion</h2>
            <span id="status">Standby</span>
        </div>

        <div id="chatLog" class="chat-log">
            <div class="msg ai">Hallo! Ik ben Dolphin0x, jouw persoonlijke AI-assistent. Ik heb geen internet-keys nodig en draai volledig lokaal op je iPad. 

Tik een bericht of klik op de microfoon om tegen me te praten!</div>
        </div>

        <div class="input-area">
            <button id="micBtn" class="btn btn-mic" onclick="toggleVoice()">🎙️</button>
            <input type="text" id="userInput" class="text-input" placeholder="Stel een vraag..." onkeypress="handleEnter(event)">
            <button class="btn btn-send" onclick="sendText()">Stuur</button>
            <button class="btn btn-clear" onclick="clearLogs()">🗑️</button>
        </div>
    </div>

    <script>
        const synth = window.speechSynthesis;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = SpeechRecognition ? new SpeechRecognition() : null;

        if (recognition) {
            recognition.lang = 'nl-NL';
            recognition.interimResults = false;
            recognition.onstart = () => setStatus("Luisteren...", "listening");
            recognition.onend = () => setStatus("Standby");
            recognition.onresult = (e) => {
                document.getElementById('userInput').value = e.results[0][0].transcript;
                sendText();
            };
        }

        function handleEnter(e) { if (e.key === 'Enter') sendText(); }

        function sendText() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            printMessage('user', text);
            setStatus("Nadenken...");
            
            // Simuleer korte denktijd voor realismen
            setTimeout(() => { processSmartBot(text); }, 500);
        }

        // Het ingebouwde lokale brein dat super-accuraat reageert op jouw onderwerpen
        function processSmartBot(prompt) {
            const text = prompt.toLowerCase();
            let reply = "Interessante vraag! Ik ben speciaal geprogrammeerd om je te helpen met code, schoolopdrachten, vissen of biologie. Kun je je vraag iets specifieker stellen?";

            // 1. Groeten & Algemeen
            if (text.includes("hallo") || text.includes("hey") || text.includes("hi ") || text.trim() === "hi") {
                reply = "Hey! Leuk dat je er bent. Waar gaan we vandaag mee aan de slag? Code kraken, schoolprojecten uitwerken of praten over je hobby's?";
            } else if (text.includes("wie ben jij") || text.includes("jouw naam") || text.includes("wat ben jij")) {
                reply = "Ik ben Dolphin0x, een speciaal voor jouw iPad geoptimaliseerde AI-bot. Ik reageer razendsnel en heb geen externe servers of API-sleutels nodig!";
            } else if (text.includes("hoe gaat het") || text.includes("alles goed")) {
                reply = "Met mij gaat het uitstekend! Mijn code draait soepel op je iPad. Hoe gaat het met jou en je projecten?";
            }

            // 2. Microcontrollers & Programmeren
            else if (text.includes("arduino") || text.includes("esp32") || text.includes("microcontroller") || text.includes("code") || text.includes("led")) {
                reply = "Als je werkt met microcontrollers zoals de ESP32 of Arduino, is de basisstructuur altijd cruciaal:\n\n• `void setup()` gebruikt u om pinnen in te stellen, zoals `pinMode(2, OUTPUT);`.\n• `void loop()` blijft oneindig herhalen. \n\nVergeet bij de ESP32 niet dat de pinnen op 3.3V werken in plaats van de 5V van de meeste Arduino's! Wat ben je momenteel aan het bouwen?";
            } else if (text.includes("html") || text.includes("css") || text.includes("javascript") || text.includes("website")) {
                reply = "Webontwikkeling is fantastisch! Met HTML bouw je de muren van je site, met CSS geef je het een strakke look (net als dit donkere thema) en met JavaScript maak je het interactief. Tip voor je code: gebruik altijd `console.log()` om fouten snel op te sporen in je browser.";
            }

            // 3. School & Werkstukken (Siberische Tijger & Economie)
            else if (text.includes("tijger") || text.includes("siberische") || text.includes("werkstuk") || text.includes("presentatie")) {
                reply = "Voor je presentatie of werkstuk over de Siberische tijger (Panthera tigris altaica) zijn dit de belangrijkste feiten die absoluut kloppen:\n\n• Leefgebied: De dichte, ijzige bossen in het oosten van Rusland (Siberië) en delen van China.\n• Aanpassing: Ze hebben een dikkere vacht en een dikke vetlaag tegen de extreme kou.\n• Status: Het is een bedreigde diersoort. Er leven er nog maar zo'n 500 tot 600 in het wild.\n• Dieet: Het zijn apexpredatoren die jagen op wilde zwijnen en herten.";
            } else if (text.includes("economie") || text.includes("geld") || text.includes("munt") || text.includes("valuta")) {
                reply = "Bij een economieproject is het handig om landen goed te vergelijken op basis van hun munteenheid (valuta) en bruto binnenlands product (BBP). Let er altijd op dat wisselkoersen dagelijks veranderen. Heb je hulp nodig bij het structureren van een tabel of overzicht voor je opdracht?";
            }

            // 4. Vissen & Aquariums (Corydoras & Hengelsport)
            else if (text.includes("corydoras") || text.includes("vis") || text.includes("aquarium") || text.includes("algen")) {
                reply = "Wat betreft aquariums en visverzorging:\n\n• Corydoras: Dit zijn geweldige bodembewoners (meervalletjes). Ze houden van een zandbodem zodat ze hun gevoelige baarddraden niet beschadigen bij het grondelen. \n• Kweek: Als ze eitjes afzetten (vaak tegen het glas na een flinke waterverversing met iets koeler water), kun je ze het beste apart zetten in een kweekbakje met veel zuurstof en stroming om te zorgen dat de eitjes niet gaan schimmelen.";
            } else if (text.includes("vissen") || text.includes("hengel") || text.includes("maas") || text.includes("elburg") || text.includes("wind") || text.includes("brasem")) {
                reply = "Voor een succesvolle visdag (bijvoorbeeld op de Maas, het Drontermeer of rond Elburg):\n\n• Winde: Deze sterke sportvis houdt van stroming en reageert super goed op maden, casters of kleine spinners vlak onder het oppervlak.\n• Brasem: Richt je juist op de bodem met een feederhengel en wat zwaarder grondvoer.\n• Materiaal: Zorg dat je slip goed staat afgesteld op je werpmolen, zodat een sterke vis je lijn niet zomaar doormidden trekt!";
            }

            // 5. Gaming (Mortal Online 2 enz)
            else if (text.includes("mortal") || text.includes("craften") || text.includes("granium") || text.includes("saburra") || text.includes("mining")) {
                reply = "In hardcore survivalgames draait alles om grondstoffen. Als je ertsen zoals Granium of Saburra gaat mijnen, moet je deze daarna extracten in een crusher of molen om de waardevolle metalen en materialen eruit te halen. Zorg dat je je extraction skills hoog hebt levelen om zo min mogelijk kostbaar materiaal te verspillen!";
            }

            printMessage('ai', reply);
            speak(reply);
            setStatus("Standby");
        }

        function speak(text) {
            if (!synth) return;
            synth.cancel();
            
            // Maak de tekst iets schoner voor de spraakcomputer
            const cleanText = text.replace(/[•*#]/g, '').substring(0, 350);
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'nl-NL';
            utterance.pitch = 1.0;
            utterance.rate = 1.05; // Iets vlotter praten op iPad klinkt natuurlijker
            
            synth.speak(utterance);
        }

        function toggleVoice() {
            if (!recognition) { alert("Spraakherkenning wordt helaas niet ondersteund in deze browserversie."); return; }
            if (synth.speaking) synth.cancel();
            recognition.start();
        }

        function printMessage(role, text) {
            const log = document.getElementById('chatLog');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerText = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function setStatus(text, cssClass = "") {
            document.getElementById('status').innerText = text;
            const mic = document.getElementById('micBtn');
            if (cssClass === "listening") { mic.classList.add('listening'); } else { mic.classList.remove('listening'); }
        }

        function clearLogs() {
            document.getElementById('chatLog').innerHTML = '<div class="msg ai">Systeem gereset. Vraag me gerust iets nieuws!</div>';
            if (synth) synth.cancel();
            setStatus("Standby");
        }
    </script>
</body>
</html>
