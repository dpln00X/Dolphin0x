<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolphin0x | Elite Suite V2</title>
    <style>
        :root { 
            --bg-main: #090e17; 
            --bg-sidebar: #020617; 
            --panel: #131c2e; 
            --accent: #2563eb; 
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: var(--bg-main); 
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
        }

        /* Auth */
        .auth-overlay { position: fixed; inset: 0; background: radial-gradient(circle at center, #1e3a8a, #050505); display: flex; align-items: center; justify-content: center; z-index: 10000; }
        .auth-card { background: rgba(19, 28, 46, 0.8); backdrop-filter: blur(12px); padding: 40px; border-radius: 24px; width: 340px; border: 1px solid #1e293b; text-align: center; }
        .auth-card input { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #334155; background: #020617; color: white; box-sizing: border-box; }

        /* App Layout */
        #app-container { display: none; height: 100vh; grid-template-columns: 300px 1fr; }
        
        /* Sidebar */
        .sidebar { background: var(--bg-sidebar); padding: 24px; border-right: 1px solid #1e293b; display: flex; flex-direction: column; gap: 20px; }
        .room-list-container { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .room-btn { padding: 12px; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .room-btn:hover, .room-btn.active { background: #1e293b; }

        /* Profiel Sectie */
        .profile-box {
            background: var(--panel);
            padding: 15px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #1e293b;
        }
        .profile-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #334155; }
        .profile-info { flex-grow: 1; min-width: 0; }
        .profile-name { font-weight: bold; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Chat */
        .chat-area { display: flex; flex-direction: column; height: 100vh; }
        .chat-header { padding: 20px; background: var(--panel); border-bottom: 1px solid #1e293b; font-size: 1.2rem; font-weight: bold; }
        .msg-feed { flex-grow: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
        
        .msg-container { display: flex; flex-direction: column; max-width: 70%; }
        .msg-container.me { align-self: flex-end; }
        .msg-container.other { align-self: flex-start; }
        .bubble { padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; word-break: break-word; }
        .me .bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .other .bubble { background: var(--panel); border-bottom-left-radius: 4px; border: 1px solid #1e293b; }
        
        .media-chat { max-width: 100%; max-height: 250px; border-radius: 8px; margin-top: 5px; display: block; }

        /* Input Balk met uploaders */
        .input-bar { padding: 20px; background: var(--panel); border-top: 1px solid #1e293b; display: flex; gap: 10px; align-items: center; }
        .input-bar input[type="text"] { flex-grow: 1; padding: 14px; border-radius: 12px; border: 1px solid #1e293b; background: var(--bg-main); color: white; }
        .file-label { cursor: pointer; padding: 12px; background: #1e293b; border-radius: 12px; font-size: 1.2rem; }

        /* Knoppen */
        .btn { padding: 12px 20px; border-radius: 12px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: #1e293b; color: white; }
        .btn-danger { background: #ef4444; color: white; }

        /* Call Screen */
        .call-screen { display: none; position: fixed; inset: 0; background: #050505; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .video-box { width: 80%; max-width: 640px; aspect-ratio: 16/9; background: #000; border-radius: 20px; overflow: hidden; border: 1px solid #334155; }
    </style>
</head>
<body>

    <div id="authOverlay" class="auth-overlay">
        <div class="auth-card">
            <h1 style="color: var(--accent); margin: 0 0 20px 0;">Dolphin0x</h1>
            <input type="email" id="email" placeholder="E-mailadres">
            <input type="password" id="pass" placeholder="Wachtwoord">
            <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="authenticate(true)">Inloggen</button>
            <button class="btn btn-secondary" style="width: 100%; margin-top: 10px;" onclick="authenticate(false)">Registreren</button>
        </div>
    </div>

    <div id="app-container">
        <div class="sidebar">
            <h2 style="margin: 0; color: var(--accent);">Dolphin0x</h2>
            <hr style="border:0; border-top:1px solid #1e293b; margin:0;">
            
            <div id="roomList" class="room-list-container"></div>

            <button class="btn btn-secondary" onclick="handleCreateRoom()">+ Nieuwe Groep</button>
            <button class="btn btn-primary" onclick="initiateCall()">📞 Videobellen</button>
            
            <div class="profile-box">
                <img id="myAvatar" class="profile-avatar" src="https://api.dicebear.com/7.x/bottts/svg" alt="Avatar">
                <div class="profile-info">
                    <div id="myName" class="profile-name">Gebruiker</div>
                    <div style="font-size:0.75rem; color:var(--text-muted);">Online</div>
                </div>
                <button onclick="editProfile()" style="background:transparent; border:none; cursor:pointer; font-size:1.1rem;">⚙️</button>
            </div>
        </div>

        <div class="chat-area">
            <div id="activeRoomTitle" class="chat-header"># global</div>
            <div id="msgFeed" class="msg-feed"></div>
            
            <div class="input-bar">
                <input type="file" id="imgUpload" accept="image/*" style="display:none;" onchange="uploadMedia(this, 'image')">
                <input type="file" id="vidUpload" accept="video/*" style="display:none;" onchange="uploadMedia(this, 'video')">
                
                <label for="imgUpload" class="file-label" title="Foto Delen">📷</label>
                <label for="vidUpload" class="file-label" title="Video Delen">🎥</label>
                
                <input type="text" id="msgInput" placeholder="Typ je bericht...">
                <button class="btn btn-primary" onclick="handleSendMessage()">Stuur</button>
            </div>
        </div>
    </div>

    <div id="callScreen" class="call-screen">
        <h2>Dolphin0x Live Gesprek</h2>
        <div class="video-box">
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <button class="btn btn-danger" onclick="endCall()">Ophangen</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZ0H4mGe6VLzLSb2ow877Xz6j684CwBGU",
            authDomain: "dolphin0x.firebaseapp.com",
            projectId: "dolphin0x",
            storageBucket: "dolphin0x.firebasestorage.app",
            messagingSenderId: "397971950369",
            appId: "1:397971950369:web:06c65ad929479656a10c60"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let activeRoomId = 'global';
        let unsubscribeMessages = null;

        // --- AUTH & USER PROFILE ---
        window.authenticate = async (isLogin) => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            if(!email || !pass) return alert("Vul alles in.");
            try {
                isLogin ? await signInWithEmailAndPassword(auth, email, pass) : await createUserWithEmailAndPassword(auth, email, pass);
            } catch(e) { alert(e.message); }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('app-container').style.display = 'grid';
                updateProfileUI();
                setupRoomListener();
                syncChatFeed();
            }
        });

        function updateProfileUI() {
            const user = auth.currentUser;
            if(user) {
                document.getElementById('myName').innerText = user.displayName || user.email.split('@')[0];
                if(user.photoURL) document.getElementById('myAvatar').src = user.photoURL;
            }
        }

        window.editProfile = async () => {
            const newName = prompt("Voer je nieuwe naam in:", auth.currentUser.displayName || "");
            const newAvatar = prompt("Plak een URL voor je profielfoto:", auth.currentUser.photoURL || "");
            
            if(newName || newAvatar) {
                await updateProfile(auth.currentUser, {
                    displayName: newName || auth.currentUser.displayName,
                    photoURL: newAvatar || auth.currentUser.photoURL
                });
                updateProfileUI();
                alert("Profiel succesvol bijgewerkt!");
            }
        };

        // --- ROOMS ---
        window.handleCreateRoom = async () => {
            const name = prompt("Groepsnaam:");
            if(!name) return;
            const cleanName = name.toLowerCase().replace(/[^a-z0-9]/g, "-");
            await addDoc(collection(db, "rooms"), { name: cleanName, serverTimestamp: serverTimestamp() });
            window.changeRoom(cleanName);
        };

        function setupRoomListener() {
            onSnapshot(collection(db, "rooms"), (snap) => {
                const list = document.getElementById('roomList');
                list.innerHTML = `<div class="room-btn ${activeRoomId === 'global' ? 'active' : ''}" onclick="changeRoom('global')"># global</div>`;
                snap.forEach(doc => {
                    const r = doc.data().name;
                    list.innerHTML += `<div class="room-btn ${activeRoomId === r ? 'active' : ''}" onclick="changeRoom('${r}')"># ${r}</div>`;
                });
            });
        }

        window.changeRoom = (id) => { activeRoomId = id; document.getElementById('activeRoomTitle').innerText = "# " + id; syncChatFeed(); setupRoomListener(); };

        // --- BERICHТEN & MEDIA ---
        window.handleSendMessage = async () => {
            const input = document.getElementById('msgInput');
            if(!input.value.trim()) return;
            await sendPayload(input.value, 'text');
            input.value = '';
        };

        // Lokale file reader om foto's/video's direct om te zetten zonder opslag-gedoe
        window.uploadMedia = function(inputElement, type) {
            const file = inputElement.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                await sendPayload(e.target.result, type);
            };
            reader.readAsDataURL(file);
        };

        async function sendPayload(content, type) {
            await addDoc(collection(db, "messages"), {
                text: content,
                room: activeRoomId,
                sender: auth.currentUser.displayName || auth.currentUser.email.split('@')[0],
                type: type,
                timestamp: serverTimestamp()
            });
        }

        function syncChatFeed() {
            if(unsubscribeMessages) unsubscribeMessages();
            const q = query(collection(db, "messages"), where("room", "==", activeRoomId), orderBy("timestamp", "asc"));
            
            unsubscribeMessages = onSnapshot(q, (snap) => {
                const feed = document.getElementById('msgFeed');
                feed.innerHTML = '';
                snap.forEach(doc => {
                    const data = doc.data();
                    const isMe = data.sender === (auth.currentUser.displayName || auth.currentUser.email.split('@')[0]);
                    
                    let body = `<div class="bubble">${data.text}</div>`;
                    if(data.type === 'image') body = `<img src="${data.text}" class="media-chat">`;
                    if(data.type === 'video') body = `<video src="${data.text}" controls class="media-chat"></video>`;

                    feed.innerHTML += `
                        <div class="msg-container ${isMe ? 'me' : 'other'}">
                            <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:2px;">${data.sender}</div>
                            ${body}
                        </div>
                    `;
                });
                feed.scrollTop = feed.scrollHeight;
            });
        }

        // --- BELLEN ---
        window.initiateCall = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('callScreen').style.display = 'flex';
            document.getElementById('localVideo').srcObject = stream;
        };
        window.endCall = () => {
            document.getElementById('localVideo').srcObject.getTracks().forEach(t => t.stop());
            document.getElementById('callScreen').style.display = 'none';
        };

        document.getElementById('msgInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleSendMessage(); });
    </script>
</body>
</html>
