<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolphin0x - Social Media & Calling Platform</title>
    <style>
        :root {
            --bg-main: #f0f2f5;
            --bg-panel: #ffffff;
            --border-color: #e4e6eb;
            --text-main: #050505;
            --text-muted: #65676b;
            --accent: #1877f2;
            --accent-hover: #166fe5;
            --accent-light: #e7f3ff;
            --danger: #e41e3f;
            --success: #45bd62;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { margin: 0; padding: 0; background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Hoofd Layout */
        .sidebar { width: 320px; background: var(--bg-panel); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 10; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }

        /* Header & Profiel */
        .profile-bar { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; background: var(--accent-light); }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #cbd5e1; border: 2px solid var(--accent); }
        .avatar-sm { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .username { font-weight: 700; font-size: 1rem; }

        /* Tabs / Navigatie binnen de Sidebar */
        .nav-tabs { display: flex; border-bottom: 1px solid var(--border-color); }
        .nav-tab { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: 600; color: var(--text-muted); background: #fafafa; }
        .nav-tab.active { color: var(--accent); border-bottom: 3px solid var(--accent); background: var(--bg-panel); }

        /* Lijsten */
        .list-container { flex-grow: 1; overflow-y: auto; padding: 10px; }
        .user-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-bottom: 5px; }
        .user-item:hover { background: var(--bg-main); }
        .user-item.active { background: var(--accent-light); }
        .call-actions { display: flex; gap: 5px; }

        /* Buttons */
        button { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
        button:hover { background: var(--accent-hover); }
        .btn-round { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; padding: 0; }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }

        /* Feed & Posts */
        .feed-container { max-width: 680px; margin: 30px auto; width: 100%; padding: 0 20px; }
        .upload-card { background: var(--bg-panel); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); margin-bottom: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .upload-card input[type="text"] { width: 100%; padding: 12px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--bg-main); outline: none; margin-bottom: 12px; }
        
        .post-card { background: var(--bg-panel); border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); overflow: hidden; }
        .post-header { padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
        .post-author { font-weight: 700; font-size: 0.95rem; }
        .post-time { font-size: 0.8rem; color: var(--text-muted); }
        .post-caption { padding: 0 16px 12px 16px; margin: 0; font-size: 0.95rem; line-height: 1.4; }
        .post-media { width: 100%; max-height: 450px; background: #000; display: flex; align-items: center; justify-content: center; }
        .post-media img { width: 100%; height: 100%; object-fit: cover; }
        .post-media video { width: 100%; height: 100%; object-fit: contain; }

        /* Comment Sectie */
        .comment-section { padding: 12px 16px; background: #f8f9fa; border-top: 1px solid var(--border-color); }
        .comments-list { max-height: 150px; overflow-y: auto; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
        .comment-item { font-size: 0.85rem; background: var(--bg-panel); padding: 8px 12px; border-radius: 14px; border: 1px solid var(--border-color); width: fit-content; max-width: 90%; }
        .comment-user { font-weight: 700; margin-right: 6px; }
        .comment-input-box { display: flex; gap: 8px; }
        .comment-input-box input { flex-grow: 1; padding: 8px 12px; border-radius: 16px; border: 1px solid var(--border-color); outline: none; font-size: 0.85rem; }

        /* Live Chat Box (Overlay of Switch) */
        .chat-view { display: none; flex-direction: column; height: 100vh; background: #e5ddd5; }
        .chat-header { background: var(--bg-panel); padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; font-weight: 700; }
        .chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-bubble { padding: 10px 14px; border-radius: 12px; max-width: 65%; font-size: 0.95rem; word-wrap: break-word; }
        .chat-bubble.me { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .chat-bubble.them { background: var(--bg-panel); align-self: flex-start; border-top-left-radius: 0; }
        .chat-input-bar { padding: 12px 20px; background: var(--bg-panel); display: flex; gap: 10px; align-items: center; }
        .chat-input-bar input { flex-grow: 1; padding: 12px; border-radius: 24px; border: 1px solid var(--border-color); outline: none; }

        /* Video Bel Scherm Overlay */
        .call-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .video-grid { display: flex; gap: 20px; margin-bottom: 30px; width: 80%; max-width: 900px; }
        .video-box { flex: 1; background: #2f3136; border-radius: 12px; overflow: hidden; height: 400px; position: relative; border: 2px solid #4f545c; }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }
        .video-label { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; }
        .call-controls { display: flex; gap: 20px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="profile-bar">
            <div class="user-info">
                <img id="myAvatar" src="https://www.w3schools.com/howto/img_avatar.png" class="avatar" alt="">
                <div>
                    <div id="myName" class="username">Laden...</div>
                    <span style="font-size: 0.75rem; color: var(--text-muted); cursor: pointer;" onclick="editProfileName()">Bewerk naam</span>
                </div>
            </div>
        </div>

        <div class="nav-tabs">
            <div id="tabFeed" class="nav-tab active" onclick="switchView('feed')">Media Feed</div>
            <div id="tabChats" class="nav-tab" onclick="switchView('chats')">Direct Messages</div>
        </div>

        <div id="listContainer" class="list-container"></div>
    </div>

    <div id="mainFeedView" class="main-content">
        <div class="feed-container">
            <div class="upload-card">
                <input type="text" id="postCaption" placeholder="Wat ben je aan het doen?">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <input type="file" id="postFile" accept="image/*,video/*" style="display:none;" onchange="document.getElementById('fileLabel').innerText = this.files[0].name">
                    <button class="btn-success" onclick="document.getElementById('postFile').click()">Kies Media</button>
                    <span id="fileLabel" style="font-size:0.85rem; color:var(--text-muted);">Geen bestand</span>
                    <button onclick="submitPost()">Posten</button>
                </div>
            </div>

            <div id="feedGrid"></div>
        </div>
    </div>

    <div id="mainChatView" class="main-content chat-view">
        <div class="chat-header">
            <img id="chatTargetAvatar" src="https://www.w3schools.com/howto/img_avatar.png" class="avatar-sm">
            <span id="chatTargetName">Gebruiker</span>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-bar">
            <input type="text" id="chatMessageInput" placeholder="Typ een bericht..." onkeydown="if(event.key==='Enter') sendDirectMessage()">
            <button onclick="sendDirectMessage()">Verstuur</button>
        </div>
    </div>

    <div id="callOverlay" class="call-overlay">
        <h2 id="callStatusText">In gesprek...</h2>
        <div class="video-grid">
            <div class="video-box">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label">Jij</div>
            </div>
            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label" id="remoteVideoLabel">Ander</div>
            </div>
        </div>
        <div class="call-controls">
            <button class="btn-danger btn-round" onclick="hangUpCall()" title="Ophangen">
                ✕
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, setDoc, updateDoc, query, orderBy, onSnapshot, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZ0H4mGe6VLzLSb2ow877Xz6j684CwBGU",
            authDomain: "dolphin0x.firebaseapp.com",
            databaseURL: "https://dolphin0x-default-rtdb.firebaseio.com",
            projectId: "dolphin0x",
            storageBucket: "dolphin0x.firebasestorage.app",
            messagingSenderId: "397971950369",
            appId: "1:397971950369:web:06c65ad929479656a10c60"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let currentUser = null;
        let activeTab = 'feed'; 
        let activeChatUid = null;
        let usersCache = {};
        let unsubscribeChat = null;

        // WebRTC Globale Variabelen voor bellen
        let localStream = null;
        let remoteStream = null;
        let peerConnection = null;
        let activeCallId = null;

        const servers = { iceServers: [{ urls: ['ice1.l.google.com:19002', 'ice2.l.google.com:19002'] }], iceCandidatePoolSize: 10 };

        // 1. AUTHENTICATIE & PROFIELEN
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                
                // Maak of haal profiel op in Firestore
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);
                
                if (!userDoc.exists()) {
                    await setDoc(userDocRef, { uid: user.uid, username: user.email.split('@')[0], avatarUrl: "https://www.w3schools.com/howto/img_avatar.png" });
                }

                // Luister naar alle gebruikers live (voor de chatlijst/profielen)
                onSnapshot(collection(db, "users"), (snapshot) => {
                    usersCache = {};
                    snapshot.forEach(d => usersCache[d.id] = d.data());
                    
                    const me = usersCache[currentUser.uid];
                    document.getElementById("myName").innerText = me.username;
                    document.getElementById("myAvatar").src = me.avatarUrl;
                    
                    renderSidebarList();
                });

                loadFeedPosts();
                listenForIncomingCalls(); // Start de luisteraar voor oproepen
            } else {
                // Generieke fallback voor testen zonder actieve inlog-sessie
                alert("Log eerst in via de hoofdapp!");
            }
        });

        window.editProfileName = async function() {
            const newName = prompt("Voer je nieuwe gebruikersnaam in:");
            if(newName) {
                await updateDoc(doc(db, "users", currentUser.uid), { username: newName });
            }
        };

        // NAVIGATION SWITCHER
        window.switchView = function(view) {
            activeTab = view;
            document.getElementById("tabFeed").classList.toggle("active", view === 'feed');
            document.getElementById("tabChats").classList.toggle("active", view === 'chats');
            renderSidebarList();

            if(view === 'feed') {
                document.getElementById("mainFeedView").style.display = "flex";
                document.getElementById("mainChatView").style.display = "none";
            }
        };

        function renderSidebarList() {
            const listEl = document.getElementById("listContainer");
            listEl.innerHTML = "";

            Object.keys(usersCache).forEach(uid => {
                if (uid === currentUser.uid) return;
                const u = usersCache[uid];

                const item = document.createElement("div");
                item.className = `user-item ${activeChatUid === uid ? 'active' : ''}`;
                
                item.innerHTML = `
                    <div class="user-info">
                        <img src="${u.avatarUrl}" class="avatar-sm">
                        <span style="font-weight:600;">${u.username}</span>
                    </div>
                    <div class="call-actions">
                        <button class="btn-success btn-round" onclick="startCall('${uid}', 'video')">📞</button>
                    </div>
                `;
                
                // Klikken op de balk opent de chat
                item.addEventListener('click', (e) => {
                    if(e.target.tagName !== 'BUTTON') openDirectChat(uid);
                });

                listEl.appendChild(item);
            });
        }

        // 2. MEDIA FEED MET REALTIE COMMENTS
        window.submitPost = async function() {
            const caption = document.getElementById("postCaption").value.trim();
            const fileInput = document.getElementById("postFile");
            const file = fileInput.files[0];

            if(!file) return alert("Selecteer een foto of video!");

            const isVideo = file.type.startsWith("video/");
            const storagePath = `social_media/${Date.now()}_${currentUser.uid}.${file.name.split('.').pop()}`;
            const fileRef = ref(storage, storagePath);

            const snap = await uploadBytes(fileRef, file);
            const url = await getDownloadURL(snap.ref);

            await addDoc(collection(db, "posts"), {
                userId: currentUser.uid,
                authorName: usersCache[currentUser.uid].username,
                caption: caption,
                mediaUrl: url,
                mediaType: isVideo ? "video" : "image",
                timestamp: new Date()
            });

            document.getElementById("postCaption").value = "";
            fileInput.value = "";
            document.getElementById("fileLabel").innerText = "Geen bestand";
        };

        function loadFeedPosts() {
            const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const feedGrid = document.getElementById("feedGrid");
                feedGrid.innerHTML = "";

                snapshot.forEach(docSnap => {
                    const post = docSnap.data();
                    const postId = docSnap.id;

                    const postEl = document.createElement("div");
                    postEl.className = "post-card";

                    let mediaTag = post.mediaType === 'video' ? `<video src="${post.mediaUrl}" controls preload="metadata"></video>` : `<img src="${post.mediaUrl}">`;

                    postEl.innerHTML = `
                        <div class="post-header">
                            <img src="https://www.w3schools.com/howto/img_avatar.png" class="avatar-sm">
                            <div>
                                <div class="post-author">${post.authorName}</div>
                            </div>
                        </div>
                        <p class="post-caption">${escapeHTML(post.caption)}</p>
                        <div class="post-media">${mediaTag}</div>
                        <div class="comment-section">
                            <div class="comments-list" id="comments-${postId}"></div>
                            <div class="comment-input-box">
                                <input type="text" id="input-${postId}" placeholder="Schrijf een reactie...">
                                <button onclick="submitComment('${postId}')">Verstuur</button>
                            </div>
                        </div>
                    `;
                    feedGrid.appendChild(postEl);
                    loadComments(postId);
                });
            });
        }

        window.submitComment = async function(postId) {
            const input = document.getElementById(`input-${postId}`);
            const text = input.value.trim();
            if(!text) return;

            await addDoc(collection(db, "posts", postId, "comments"), {
                userId: currentUser.uid,
                username: usersCache[currentUser.uid].username,
                text: text,
                timestamp: new Date()
            });
            input.value = "";
        };

        function loadComments(postId) {
            const q = query(collection(db, "posts", postId, "comments"), orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                const box = document.getElementById(`comments-${postId}`);
                if(!box) return;
                box.innerHTML = "";
                snapshot.forEach(d => {
                    const c = d.data();
                    box.innerHTML += `
                        <div class="comment-item">
                            <span class="comment-user">${c.username}:</span><span>${escapeHTML(c.text)}</span>
                        </div>
                    `;
                });
            });
        }

        // 3. REALTIME DIRECT CHATTEN
        function openDirectChat(targetUid) {
            activeChatUid = targetUid;
            document.getElementById("mainFeedView").style.display = "none";
            document.getElementById("mainChatView").style.display = "flex";
            
            document.getElementById("chatTargetName").innerText = usersCache[targetUid].username;
            document.getElementById("chatTargetAvatar").src = usersCache[targetUid].avatarUrl;

            if(unsubscribeChat) unsubscribeChat();

            const chatId = currentUser.uid < targetUid ? `${currentUser.uid}_${targetUid}` : `${targetUid}_${currentUser.uid}`;
            const q = query(collection(db, "direct_chats", chatId, "messages"), orderBy("timestamp", "asc"));

            unsubscribeChat = onSnapshot(q, (snapshot) => {
                const msgBox = document.getElementById("chatMessages");
                msgBox.innerHTML = "";
                snapshot.forEach(d => {
                    const m = d.data();
                    const isMe = m.senderId === currentUser.uid;
                    msgBox.innerHTML += `<div class="chat-bubble ${isMe ? 'me' : 'them'}">${escapeHTML(m.text)}</div>`;
                });
                msgBox.scrollTop = msgBox.scrollHeight;
            });
        }

        window.sendDirectMessage = async function() {
            const input = document.getElementById("chatMessageInput");
            const text = input.value.trim();
            if(!text || !activeChatUid) return;

            const chatId = currentUser.uid < activeChatUid ? `${currentUser.uid}_${activeChatUid}` : `${activeChatUid}_${currentUser.uid}`;
            await addDoc(collection(db, "direct_chats", chatId, "messages"), {
                senderId: currentUser.uid,
                text: text,
                timestamp: new Date()
            });
            input.value = "";
        };

        // 4. WEBRTC AUDIO/VIDEO BELLEN VIA FIREBASE SIGNALLING
        window.startCall = async function(targetUid) {
            document.getElementById("callOverlay").style.display = "flex";
            document.getElementById("callStatusText").innerText = "Verbinding zoeken...";

            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            remoteStream = new MediaStream();

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.ontrack = event => event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));

            document.getElementById("localVideo").srcObject = localStream;
            document.getElementById("remoteVideo").srcObject = remoteStream;

            const callDocRef = doc(collection(db, "calls"));
            activeCallId = callDocRef.id;

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    addDoc(collection(callDocRef, "callerCandidates"), event.candidate.toJSON());
                }
            };

            const offerDescription = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offerDescription);

            await setDoc(callDocRef, {
                offer: { type: offerDescription.type, sdp: offerDescription.sdp },
                caller: currentUser.uid,
                receiver: targetUid,
                status: "ringing"
            });

            // Luister naar antwoord
            onSnapshot(callDocRef, async (snapshot) => {
                const data = snapshot.data();
                if (data?.answer && !peerConnection.currentRemoteDescription) {
                    const answerDescription = new RTCSessionDescription(data.answer);
                    await peerConnection.setRemoteDescription(answerDescription);
                    document.getElementById("callStatusText").innerText = "In gesprek";
                }
                if (data?.status === "ended") {
                    closeCallUI();
                }
            });

            // Luister naar remote ICE candidates
            onSnapshot(collection(callDocRef, "receiverCandidates"), snapshot => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                    }
                });
            });
        };

        function listenForIncomingCalls() {
            // Setup RTC Peer Connection basis
            peerConnection = new RTCPeerConnection(servers);

            const q = query(collection(db, "calls"));
            onSnapshot(q, snapshot => {
                snapshot.docChanges().forEach(async change => {
                    if (change.type === 'added' || change.type === 'modified') {
                        const callData = change.doc.data();
                        if (callData.receiver === currentUser.uid && callData.status === "ringing") {
                            activeCallId = change.doc.id;
                            if(confirm(`Inkomende oproep van een gebruiker! Wil je opnemen?`)) {
                                acceptIncomingCall(change.doc.ref, callData);
                            } else {
                                await updateDoc(change.doc.ref, { status: "ended" });
                            }
                        }
                    }
                });
            });
        }

        async function acceptIncomingCall(callDocRef, callData) {
            document.getElementById("callOverlay").style.display = "flex";
            document.getElementById("callStatusText").innerText = "Verbinden...";

            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            remoteStream = new MediaStream();

            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.ontrack = event => event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));

            document.getElementById("localVideo").srcObject = localStream;
            document.getElementById("remoteVideo").srcObject = remoteStream;

            peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    addDoc(collection(callDocRef, "receiverCandidates"), event.candidate.toJSON());
                }
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
            const answerDescription = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answerDescription);

            await updateDoc(callDocRef, {
                answer: { type: answerDescription.type, sdp: answerDescription.sdp },
                status: "active"
            });

            onSnapshot(collection(callDocRef, "callerCandidates"), snapshot => {
                snapshot.docChanges().forEach(change => {
                    if (change.type === 'added') {
                        peerConnection.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                    }
                });
            });

            onSnapshot(callDocRef, snapshot => {
                if (snapshot.data()?.status === "ended") closeCallUI();
            });
        }

        window.hangUpCall = async function() {
            if(activeCallId) {
                await updateDoc(doc(db, "calls", activeCallId), { status: "ended" });
            }
            closeCallUI();
        };

        function closeCallUI() {
            document.getElementById("callOverlay").style.display = "none";
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            if (peerConnection) peerConnection.close();
            // Maak verbinding klaar voor een volgende oproep
            peerConnection = new RTCPeerConnection(servers);
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t));
        }
    </script>
</body>
</html>
